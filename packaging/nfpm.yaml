# nfpm config for the Debian/Ubuntu/Raspberry Pi .deb.
#   DEB_ARCH=arm64 VERSION=1.2.3 nfpm package -p deb -f packaging/nfpm.yaml
#
# The .deb is SELF-CONTAINED: it ships a Python-free `dreame-valetudo` bundle (the interpreter +
# the whole package frozen in by PyInstaller), the `dreame-fastboot` libusb client (pyusb frozen
# in), and a prebuilt `sunxi-fel` — all built per arch in CI. So it needs no python3 / python3-usb
# (bundled) or jq (fix-impl patches JSON in-process); it still needs the ubiquitous base-repo
# libusb + curl the tool loads/shells at runtime. Because it ships compiled binaries it is
# architecture-specific (amd64/arm64).
#
# Each frozen tool is a PyInstaller onedir tree (see packaging/build-bundle.sh for why Linux does
# not use onefile), so each gets its OWN directory and is reached through a symlink to its
# launcher. Keeping the trees apart is what leaves /usr/lib/dreame-valetudo itself an ordinary
# helper directory: the tool's libexec search (find_helper) wants a runnable FILE at
# /usr/lib/dreame-valetudo/dreame-fastboot, which a symlink satisfies and a directory does not.
# The bootloader resolves symlinks before looking for its contents directory, so no wrapper and no
# DREAME_LIBEXEC are needed for either link.
name: dreame-valetudo
arch: "${DEB_ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: "Cody Bryant <SisyphusMD@users.noreply.github.com>"
vendor: SisyphusMD
homepage: https://github.com/SisyphusMD/dreame-valetudo
license: AGPL-3.0-or-later
description: |
  Guided, idempotent tool to root supported Dreame robot vacuums (X40 Ultra, X30 Ultra,
  L10s Pro Ultra Heat, and the rest of the MR813 gen3 family) and install Valetudo, the local
  cloud-free robot firmware. Self-contained: no python3 or pyusb needed on the target.

depends:
  # check-glibc-floor.py proves no ELF embedded in the frozen release artifacts exceeds this floor.
  - libc6 (>= ${GLIBC_FLOOR})
  - libusb-1.0-0         # the bundled fastboot client + sunxi-fel load libusb at runtime
  - libfdt1              # sunxi-fel also links libfdt at runtime
  - curl                 # downloads (stage1 pkg + Valetudo binary) still shell out to curl
  - tar                  # fetch extracts the verified stage1 archive
  - unzip                # the image phase unpacks the dustbuilder FEL zip
  - zip                  # recon archives the pre-root recovery backup (recon.py's `zip -q -j`)
  - openssh-client       # phase 3 push + the fix-*/diagnose helpers run ssh
  - tmux                 # every run is wrapped in a session so a lost terminal can't end it

contents:
  # No file_info on the trees: an explicit mode there is applied to EVERY member, which would make
  # the whole bundle executable and world-readable alike. The built modes are the right ones.
  - src: ./dist/dreame-valetudo              # self-contained main bundle (Python frozen in)
    dst: /usr/lib/dreame-valetudo/app
    type: tree
  - src: /usr/lib/dreame-valetudo/app/dreame-valetudo
    dst: /usr/bin/dreame-valetudo
    type: symlink
  - src: ./dist/dreame-fastboot              # fastboot libusb client (pyusb frozen in)
    dst: /usr/lib/dreame-valetudo/fastboot
    type: tree
  - src: /usr/lib/dreame-valetudo/fastboot/dreame-fastboot
    dst: /usr/lib/dreame-valetudo/dreame-fastboot
    type: symlink
  - src: ./sunxi-fel                         # built per arch in CI, bundled so nothing compiles at runtime
    dst: /usr/lib/dreame-valetudo/sunxi-fel
    file_info:
      mode: 0755
  - src: ./packaging/udev/99-dreame-valetudo.rules   # USB access without sudo
    dst: /usr/lib/udev/rules.d/99-dreame-valetudo.rules

scripts:
  postinstall: ./packaging/deb-postinstall.sh   # reload udev so the rules apply immediately (deb + rpm)

# RPM (Fedora/RHEL/openSUSE) names its runtime deps differently than Debian, and the names vary across
# distros (libusb is libusbx / libusb1 / libusb-1_0-0). SONAME + file-path requires survive that: rpm
# resolves whichever package provides the .so / the file. Both target arches are 64-bit ELF. The udev
# rule + postinstall above apply to the .rpm too (nfpm contents/scripts are format-agnostic), so a
# .rpm install sets up sudo-less USB access automatically, same as the .deb.
overrides:
  rpm:
    depends:
      - glibc >= ${GLIBC_FLOOR}
      - "libusb-1.0.so.0()(64bit)"
      - "libfdt.so.1()(64bit)"
      - /usr/bin/curl
      - /usr/bin/tar
      - /usr/bin/unzip
      - /usr/bin/zip
      - /usr/bin/ssh
      - /usr/bin/tmux
