name: CI (macOS)

# Forgejo remains the primary CI authority. This workflow supplies the two native macOS legs that
# its Linux-only runners cannot execute; the Forgejo workflow waits for this exact mirrored SHA.
on:
  push:
    branches: ["**"]
  # A fork's branch is never pushed here, so `push` alone leaves fork pull requests with no
  # macOS coverage at all. Nothing in this workflow reads a secret, so a fork may run it.
  pull_request:
  workflow_dispatch:

# Keyed per COMMIT and never cancelled, because the release gates read this workflow's verdict for
# one exact SHA. Under a ref-keyed group with cancel-in-progress, a push landing while the release
# is being cut cancels the very run the gate is waiting on, and a commit whose only run was
# cancelled has no verdict — which the gate can only read as "not green", permanently, for a commit
# that never failed anything.
#
# The one exception is a Renovate branch. Its commits are never released (a merge lands as a new
# commit on main, which runs in full), and each rebase replaces the previous commit outright, so an
# older run there only holds a place in a queue that GitHub drains a few macOS jobs at a time.
concurrency:
  group: macos-ci-${{ startsWith(github.ref, 'refs/heads/renovate/') && github.ref || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  scope:
    name: Does this push need a Mac
    # packaging/macos-scope.sh: a Renovate branch that changes only Linux-side files skips the
    # macOS job below. The run still concludes success, and that is the verdict check-mirror-ci.sh
    # reads for the PR. main, tags and every other branch always run in full.
    # Same fork filter as the macOS job: a same-repo PR's commit is already scoped by its push run.
    if: >-
      ${{ github.server_url == 'https://github.com'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scope is measured from where the branch left main.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        # An assignment, so a failing script fails this job instead of writing an empty verdict.
        run: |
          scope="$(bash packaging/macos-scope.sh "$GITHUB_REF")"
          echo "macos=$scope" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.arch }}, ${{ matrix.tier }})
    # Forgejo also reads .github/workflows but has no macOS runner.
    # A same-repo PR branch already ran on `push` above, and that is the run the release
    # gate reads (check-mirror-ci.sh queries event=push only), so a pull_request run for
    # the same commit decides nothing the gate will ever look at. Fork PRs never fire
    # push in this repository, so for them the pull_request run is the ONLY coverage and
    # has to survive the filter.
    #
    # This is not free, and the cost is worth naming: the two runs are not identical, as
    # `pull_request` checks out the synthetic merge of head into base while `push` checks
    # the head. What is given up is macOS coverage of that merge BEFORE it lands, not of
    # the merged code — `branches: ["**"]` includes main, so the merge commit is tested
    # the moment it arrives. Keeping the PR run instead of the push run is not an option:
    # a prerelease can be dispatched from any branch and the gate would find no
    # event=push run for that commit at all.
    needs: scope
    if: >-
      ${{ github.server_url == 'https://github.com'
      && needs.scope.outputs.macos != 'false'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            tier: floor
          - os: macos-26
            arch: arm64
            tier: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
      - name: Install native test dependencies
        run: |
          # The runner image ships aws/tap, which Homebrew's tap-trust check flags on every brew
          # call; only homebrew-core formulae are installed, so drop the stray tap instead.
          brew untap aws/tap 2>/dev/null || true
          brew install bash shellcheck tmux
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Lint, typecheck, and run Python tests
        run: |
          # renovate: datasource=pypi depName=ruff
          RUFF="0.17.3"
          # renovate: datasource=pypi depName=mypy
          MYPY="2.4.1"
          # renovate: datasource=pypi depName=pytest
          PYTEST="9.2.0"
          # renovate: datasource=pypi depName=pyyaml
          PYYAML="6.0.3"
          python -m pip install --upgrade pip
          pip install "ruff==$RUFF" "mypy==$MYPY" "pytest==$PYTEST" "pyyaml==$PYYAML" -e .
          ruff check $(git ls-files '*.py' | tr '\n' ' ')
          mypy
          python -m compileall -q docs/research/tools packaging/stamp-version.py packaging/build-source-tar.py packaging/check-doc-links.py packaging/check-release-boundary.py
          python docs/research/tools/compute_dust_token.py --selftest
          pytest -q tests/python
      - name: Check shell scripts
        # Every tracked script, at DEFAULT severity — the same set and threshold every other
        # gate uses. A hand-listed set of directories silently stops covering a script added
        # outside them, which is how a shell defect reaches a release green.
        run: git ls-files '*.sh' | xargs shellcheck
      - name: Run integration scripts with native tmux
        run: |
          for t in tests/release/*.sh; do
            echo "== $t =="
            bash "$t"
          done
