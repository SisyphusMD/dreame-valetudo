name: Install matrix (macOS + Linux arm64)

# Installs every channel we publish that needs a macOS or an arm64 machine, from the PUBLISHED
# artifacts, and then runs the tool. Each leg ends in `packaging/installed-smoke.sh`, which is the
# single definition of "an installed dreame-valetudo works" — adding a channel later means
# installing it and calling that.
#
# The Linux amd64 half is `.forgejo/workflows/install-matrix.yml`. Architecture decides the forge:
# everything that can run natively on our own runner does, and what needs hardware we do not have
# runs here on GitHub's. Nothing is emulated on either.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests. What it gates is
# the next STABLE cut.

# The run-name is load-bearing, not decoration. A tag push carries the tag in head_branch, but a
# DISPATCH is deliberately made from main (so a fix to these scripts is what re-runs, not the
# copies frozen at the tag) and would otherwise record nothing about which tag it tested.
run-name: Install matrix (macOS + Linux arm64) ${{ inputs.tag || github.ref_name }}

# Dispatched by publish.yml once the release is complete, exactly like the Forgejo half.
# Triggering on the tag instead meant this waited ~22 minutes for artifacts publish had not
# built yet. That wait blocked nothing here — GitHub's runners were free, and every leg still
# started within seconds of the artifacts landing — so this buys no wall clock. It is for
# consistency: one mechanism starts both halves, and a mechanism that differs per forge is how
# the two drift apart.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.3.0-rc.18"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: forgejo.bryantserver.com

jobs:
  # One poll for everyone. Every leg waiting on the same release would spend several times the API
  # budget to learn the same fact.
  wait:
    name: Wait for the release to carry everything
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Poll until the release is installable
        id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The tap formula too, because one leg pours a bottle. A stable tag writes the
          # `dreame-valetudo` formula; a candidate writes only `dreame-valetudo-rc`.
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          bash packaging/wait-for-release.sh "$TAG" "$FORMULA"

  macos:
    name: macOS installs (${{ matrix.os }})
    needs: wait
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor and current, both architectures. The floor is what the bottles are built on and
        # what Homebrew falls back to; the current one is what most people are actually running.
        include:
          - {os: macos-15,       arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: macos-26,       arch: arm64}
          - {os: macos-26-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The signed .pkg — install it, and check it is really notarized
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          DL="https://$FORGE/SisyphusMD/dreame-valetudo/releases/download/$TAG"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 -o /tmp/d.pkg "$DL/dreame-valetudo-${VERSION}-macos-${{ matrix.arch }}.pkg"
          # Gatekeeper's own verdict, before installing. `installer` does not enforce notarization,
          # so installing successfully proves nothing about whether a user double-clicking it would
          # be allowed to.
          spctl -a -vvv -t install /tmp/d.pkg 2>&1 | tee /tmp/spctl.txt
          grep -qi "accepted" /tmp/spctl.txt
          grep -qi "notarized" /tmp/spctl.txt || { echo "::error::pkg is signed but NOT notarized"; exit 1; }
          pkgutil --check-signature /tmp/d.pkg | head -5
          sudo installer -pkg /tmp/d.pkg -target /
          bash packaging/installed-smoke.sh /usr/local/bin/dreame-valetudo "$VERSION"
      - name: The Homebrew bottle — pour it, and prove it was poured
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          # The .pkg put a binary at /usr/local/bin; remove it so the smoke that follows is
          # unambiguously exercising the brew install.
          sudo rm -f /usr/local/bin/dreame-valetudo
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          brew update --quiet >/dev/null 2>&1
          brew tap sisyphusmd/tap "https://$FORGE/SisyphusMD/homebrew-tap.git" >/dev/null 2>&1
          # Homebrew refuses to LOAD a formula from an untrusted third-party tap, and installing the rc
          # loads the stable one its `conflicts_with` names. Guarded on the subcommand existing: an older
          # Homebrew has no `trust` and needs none, while one that exists and fails must stop the job.
          if brew commands 2>/dev/null | tr ' ' '\n' | grep -qx trust; then brew trust sisyphusmd/tap; fi
          brew install "sisyphusmd/tap/$FORMULA" > /tmp/i.log 2>&1 || { tail -30 /tmp/i.log; exit 1; }
          # If the tap's bottle block is missing or stale, brew silently builds from source and
          # everything looks fine — slower, but green. The "Pouring" line is the direct evidence.
          grep -qi "pouring dreame-valetudo" /tmp/i.log \
            || { echo "::error::built from source instead of pouring"; grep -iE "building|installing" /tmp/i.log | head -5; exit 1; }
          # NO dependency-count heuristic, deliberately — the Linux leg carries the same note.
          # `dtc` and `pkg-config` are ordinary `depends_on`, not `:build`, so Homebrew installs
          # them for a POURED bottle too: the count grows on a perfectly correct pour. (The sibling
          # project can count, because its pkgconf and rust are `=> :build`.)
          #
          # sunxi-fel rides inside the bottle, so a poured install must already have it — this is
          # the check that proves the caveat about a first-run source build is really gone.
          test -x "$(brew --prefix)/opt/$FORMULA/libexec/tools/sunxi-fel"
          bash packaging/installed-smoke.sh "$(brew --prefix)/bin/dreame-valetudo" "$VERSION"
      - name: PyPI via uv tool
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          brew uninstall --force "$FORMULA" >/dev/null 2>&1 || true
          # PEP 440: the tag says 0.3.0-rc.1, PyPI normalizes it to 0.3.0rc1.
          PYPI_V="$(printf '%s' "$VERSION" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 -o /tmp/uv-install.sh https://astral.sh/uv/install.sh
          # Written to a file, never piped: curl cannot rewind a pipe, so a retried
          # partial body would reach `sh` concatenated with the first attempt's.
          sh /tmp/uv-install.sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          printf '#!/bin/sh\nexec uvx -q --from '"'"'dreame-valetudo==%s'"'"' dreame-valetudo "$@"\n' "$PYPI_V" > /tmp/dv
          chmod +x /tmp/dv
          bash packaging/installed-smoke.sh /tmp/dv "$VERSION"

  # Every Linux channel, on real arm64 silicon. Its amd64 twin runs on Forgejo and calls the SAME
  # script, which is what keeps the two architectures testing the same list of channels rather than
  # two lists that were equal once.
  linux-arm64:
    name: Linux installs (arm64) shard ${{ matrix.shard }}
    needs: wait
    # Sharded because the channels are independent and were only sequential by default. On the arm64
    # runner that sequence was the whole tail of a release: every macOS leg finished in minutes while
    # this one job worked through two dozen channels for half an hour. Round-robin inside the script
    # keeps the heavy channels (the bottle pour drags a multi-GB image) off any single shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needed for `--output type=local`, which the default docker driver does not support. No
      # registry mirror here: that one is on our network, not this one.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # GitHub's arm64 hosted runner has roughly 14 GB of SSD. A ceiling above that would
          # never prune at all, which is the failure mode that looks like nothing is wrong.
          CACHE_CEILING_GB: "4"
        run: bash packaging/install-matrix-arch.sh arm64 ${{ matrix.shard }} 4

  summary:
    name: Every macOS and Linux arm64 channel installed and ran
    needs: [macos, linux-arm64]
    if: ${{ always() && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          echo "macos:       ${{ needs.macos.result }}"
          echo "linux-arm64: ${{ needs.linux-arm64.result }}"
          # Both, and named separately: a summary that only reported the worse of the two would say
          # "something is broken" about a matrix whose whole job is to say WHICH thing is.
          bad=""
          [ "${{ needs.macos.result }}" = success ] || bad="$bad macOS"
          [ "${{ needs.linux-arm64.result }}" = success ] || bad="$bad Linux-arm64"
          [ -z "$bad" ] || { echo "::error::install channels are broken for $TAG:$bad"; exit 1; }
