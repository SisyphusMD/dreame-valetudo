name: Release (macOS pkg)

# The one job that needs a Mac, so it lives on the GitHub mirror (free hosted macOS runners).
# It builds a SELF-CONTAINED, signed + notarized .pkg for BOTH arm64 and x86_64 (a matrix) — each
# bundles a prebuilt sunxi-fel, a PyInstaller'd fastboot client, and libusb —
# so ANY Mac user (Apple Silicon or Intel) double-clicks and gets a working `dreame-valetudo` with
# nothing else to install. The publish job appends both .pkgs to the GitHub + public-Forgejo
# releases (the only two it can reach); publish.yml's nas-pkg job bridges them to the NAS.
#
# NOTE: the native-library bundling + codesign is the one piece that can't be dry-run off-CI.
# Both architectures are installed and exercised on native floor and current GitHub runners.
on:
  push:
    # Stable and prerelease (v1.2.3-rc.N) tags both build the signed .pkg; the publish step marks
    # prereleases via the release helper.
    tags: ["v*.*.*", "v*.*.*-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test signed pkg (${{ matrix.arch }}, macOS 15 floor)
    # Forgejo Actions also reads .github/workflows but has no macOS runner — only run on GitHub.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # renovate: datasource=github-tags depName=python/cpython versioning=pep440
          python-version: "3.14.6"   # exact interpreter frozen into the bundle

      - name: Install, test, and uninstall the Homebrew release formula
        run: bash packaging/test-homebrew-formula.sh "$GITHUB_REF_NAME"

      - name: Build sunxi-fel + the PyInstaller fastboot client
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          # The runner image ships aws/tap, which Homebrew's tap-trust check flags on every brew
          # call; only homebrew-core formulae are installed, so drop the stray tap instead.
          brew untap aws/tap 2>/dev/null || true
          brew install libusb dtc pkg-config libevent
          read_pin() { python3 -c "import re; print(re.search(r'$1 = \"([^\"]+)\"', open('dreame_valetudo/constants.py').read()).group(1))"; }
          # sunxi-fel builds native to the runner from the package's single source-of-truth pin.
          SREF="$(read_pin SUNXI_TOOLS_REF)"
          git clone https://github.com/linux-sunxi/sunxi-tools.git /tmp/sunxi-tools
          git -C /tmp/sunxi-tools checkout "$SREF"
          make -C /tmp/sunxi-tools sunxi-fel
          cp /tmp/sunxi-tools/sunxi-fel .
          # Self-contained native binaries (python + the package / pyusb frozen in).
          python -m pip install --upgrade pip
          # renovate: datasource=pypi depName=pyinstaller
          python -m pip install pyinstaller==6.22.0
          PYUSB="$(read_pin PYUSB_VERSION)"
          python -m pip install "pyusb==$PYUSB"
          rm -rf dist
          bash packaging/build-bundle.sh "$PWD/dist"           # main tool bundle (Python frozen in)
          bash packaging/build-fastboot-client.sh "$PWD/dist"  # dreame-fastboot client (pyusb frozen in)
          cp dist/dreame-valetudo dist/dreame-fastboot .
          # tmux: every run is wrapped in a session, and a .pkg install has no package manager to
          # supply one. Built against the SYSTEM ncurses (every Mac has it, and its terminfo), so
          # only libevent has to travel with the bundle. utf8proc is explicitly disabled: tmux's
          # configure refuses to guess on macOS, and enabling it would add a Homebrew dylib to the
          # bundle for marginal Unicode width tables.
          TMUX="$(read_pin TMUX_VERSION)"
          TMUX_SHA="$(read_pin TMUX_SHA256)"
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${TMUX}/tmux-${TMUX}.tar.gz" -o /tmp/tmux.tgz
          printf '%s  %s\n' "$TMUX_SHA" /tmp/tmux.tgz | shasum -a 256 -c -
          tar -xzf /tmp/tmux.tgz -C /tmp
          (cd "/tmp/tmux-${TMUX}" && ./configure --disable-utf8proc >/dev/null && make -j3 >/dev/null)
          cp "/tmp/tmux-${TMUX}/tmux" .

      - name: Bundle libusb next to the native binaries
        run: |
          set -euo pipefail
          # brew --prefix adapts per arch (/opt/homebrew on arm64, /usr/local on Intel).
          LIBUSB="$(brew --prefix libusb)/lib/libusb-1.0.0.dylib"
          cp "$LIBUSB" ./libusb-1.0.0.dylib
          chmod u+w ./libusb-1.0.0.dylib
          # Point sunxi-fel's libusb reference at the co-located copy; the absolute Homebrew path
          # will not exist on a user's Mac. PyInstaller separately embeds libusb in dreame-fastboot.
          OLD="$(otool -L sunxi-fel | awk '/libusb-1.0/{print $1; exit}')"
          install_name_tool -change "$OLD" "@loader_path/libusb-1.0.0.dylib" sunxi-fel
          install_name_tool -id "@loader_path/libusb-1.0.0.dylib" ./libusb-1.0.0.dylib
          # Every OTHER non-system dependency, for both native binaries: tmux drags in libevent,
          # and sunxi-fel links libfdt from dtc. Hand-rewriting one reference per binary is what
          # left sunxi-fel pointing at a Homebrew libfdt that does not exist on a user's Mac — the
          # exact machine the .pkg is for. The helper walks the whole chain instead, and skips the
          # @loader_path reference set just above.
          bash packaging/bundle-macos-dylibs.sh ./tmux .
          bash packaging/bundle-macos-dylibs.sh ./sunxi-fel .
          # Nothing may still point into Homebrew by the time this is packaged.
          for b in ./tmux ./sunxi-fel ./*.dylib; do
            if otool -L "$b" | tail -n +2 | grep -qE '^\s+(/opt/homebrew|/usr/local/(opt|Cellar))'; then
              echo "::error::$b still references a Homebrew path:"; otool -L "$b"; exit 1
            fi
          done

      - name: Import signing certificates
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f app.p12 installer.p12' EXIT
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APP_CERT_P12" | base64 -d > app.p12
          echo "$INSTALLER_CERT_P12" | base64 -d > installer.p12
          security import app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import installer.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Sign, assemble, package, notarize, staple
        env:
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          trap 'rm -f notary.p8' EXIT
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="dreame-valetudo-macos-${{ matrix.arch }}.pkg"
          # Sign the native Mach-O bits with the hardened runtime (required for notarization).
          for f in ./*.dylib tmux sunxi-fel dreame-fastboot dreame-valetudo; do
            codesign --force --options runtime --timestamp \
              --entitlements packaging/entitlements.plist --sign "$APP_IDENTITY" "$f"
          done
          # Lay out the install tree: native binaries in libexec, a thin wrapper in bin. The main
          # bundle has fastboot-libusb.py + the form baseline frozen in (via _MEIPASS), so libexec
          # only needs the native helpers + the co-located libusb.
          LX=root/usr/local/libexec/dreame-valetudo
          mkdir -p "$LX" root/usr/local/bin
          cp dreame-valetudo dreame-fastboot sunxi-fel tmux ./*.dylib "$LX/"
          # macOS cannot uninstall a .pkg; ship the remover beside what it removes.
          install -m 0755 packaging/uninstall-macos.sh "$LX/uninstall.sh"
          cat > root/usr/local/bin/dreame-valetudo <<'SH'
          #!/bin/bash
          export DREAME_LIBEXEC="/usr/local/libexec/dreame-valetudo"
          exec "/usr/local/libexec/dreame-valetudo/dreame-valetudo" "$@"
          SH
          chmod +x root/usr/local/bin/dreame-valetudo "$LX/dreame-valetudo"
          pkgbuild --root root --identifier com.sisyphusmd.dreame-valetudo \
            --version "$VERSION" --install-location / unsigned.pkg
          productsign --sign "$INSTALLER_IDENTITY" unsigned.pkg "$PKG"
          echo "$NOTARY_KEY_P8" | base64 -d > notary.p8
          xcrun notarytool submit "$PKG" \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple "$PKG"

      - name: Install, exercise, and uninstall the signed package
        run: >-
          bash packaging/test-macos-package.sh
          "dreame-valetudo-macos-${{ matrix.arch }}.pkg"
          "${{ matrix.arch }}" "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.arch }}
          path: dreame-valetudo-macos-${{ matrix.arch }}.pkg

  current:
    name: Test floor-built pkg (${{ matrix.arch }}, macOS 26 current)
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-${{ matrix.arch }}
          path: .
      - name: Install, exercise, and uninstall the floor-built signed package
        run: >-
          bash packaging/test-macos-package.sh
          "dreame-valetudo-macos-${{ matrix.arch }}.pkg"
          "${{ matrix.arch }}" "${GITHUB_REF_NAME#v}"

  publish:
    name: Append the signed .pkgs to the GitHub + Forgejo releases
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [build, current]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: pkgs
          merge-multiple: true
      - name: Append both .pkgs to the GitHub + public-Forgejo releases
        run: |
          set -euo pipefail
          bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          chmod +x packaging/github-release.sh packaging/forgejo-release.sh
          packaging/github-release.sh "${{ secrets.GITHUB_TOKEN }}" \
            "$GITHUB_REF_NAME" notes.md pkgs/*.pkg
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md pkgs/*.pkg
