name: Install matrix

# Installs every channel we publish, from the PUBLISHED artifacts, on every platform we ship for —
# Linux amd64, Linux arm64 and macOS — and then runs the tool. Each leg ends in
# `packaging/installed-smoke.sh`, the single definition of "an installed dreame-valetudo works".
# Architecture picks the runner label: amd64 on the cluster, arm64 on the arm64 VM, macOS on the
# macOS 15 and newest-macOS VMs. Nothing is emulated anywhere. One workflow, so the stable gate
# reads one run for all three.
#
# WHY IT EXISTS. Until this, the only thing that installed a real release was package-smoke — one
# .deb, one distro. That was defensible while the only channel was "download a file". It stopped
# being defensible when this project gained an apt/dnf REPOSITORY and a Homebrew bottle: a
# repository is a URL every subscriber's package manager resolves on every update, and a bottle
# silently falls back to a source build when its checksums are stale. Neither had anything
# proving it worked. Ported from the sibling project, whose matrix had covered this for months.
#
# Every channel is a buildx target rather than a `docker run`, because the job itself runs in a
# container and a bind mount of the workspace is invisible to the daemon. BuildKit streams its
# context instead, so there is nothing to mount. What each channel does lives in
# packaging/install-smoke.Dockerfile, and the channel LIST lives in
# packaging/install-matrix-arch.sh so the two architectures cannot test different sets.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests. What it gates is
# the next STABLE cut.

# Dispatched by publish.yml once the release is actually complete, NOT by the tag push that starts
# publish. Both used to fire at the same instant, so the wait job below held one of this runner's
# few slots for its entire budget, polling for artifacts the publish it was starving had not built
# yet. Forgejo has no `workflow_run`, so the finished publish says so explicitly.
#
# Dispatch is also what a re-run has always used, for an unrelated reason worth keeping in view: the
# tag is an INPUT rather than the ref, because a dispatch AT the tag would faithfully re-run the
# scripts frozen there, and the reason to re-run is usually a fix to those scripts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.3.0-rc.18"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: https://forgejo.bryantserver.com

jobs:
  wait:
    # The tag is in the JOB name because that is the only place Forgejo keeps it: a dispatched run's
    # title is just the workflow name, and a tag push's is the commit message.
    name: Wait for ${{ inputs.tag || github.ref_name }} to be installable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Waits on the same asset-role table reconcile replicates, so a new artifact is added in
          # one place and both learn about it.
          bash packaging/wait-for-release.sh "$TAG"
        env:
          # Only this step reads it, so it is not granted to the shard jobs or their actions.
          GITHUB_ASSET_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}

  linux:
    name: Linux installs (amd64) shard ${{ matrix.shard }}
    needs: wait
    # Sharded for the same reason as the arm64 leg, but TWO ways rather than four, because this
    # runner pool is shared with every PR check and the sibling project's publish. Four shards would
    # take most of it for a leg that is not the slow one (8-14 minutes), so finishing it sooner
    # does not move the release. Same mechanism, sized to the pool, exactly as CACHE_CEILING_GB
    # below is sized to the disk.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    # NO QEMU setup: this runner is amd64, the script refuses to build for anything else, and the
    # arm64 leg below runs natively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # The self-hosted runner's dind volume; its own idle pruner keeps 25 GiB free, so a
          # third of the volume leaves room for the images the channels pull beside the cache.
          CACHE_CEILING_GB: "20"
          # Self-hosted only: the hosted runners are not on this network. Homebrew keeps the
          # /v2/homebrew/core path and rewrites only scheme and host, so the registry serves
          # that namespace at its root specifically for this.
          BREW_MIRROR: "https://image-mirror.lan.bryantserver.com"
        run: bash packaging/install-matrix-arch.sh amd64 ${{ matrix.shard }} 2

  # Every Linux channel, on real arm64 silicon. It calls the SAME script as the amd64 leg, which is
  # what keeps the two architectures testing the same list of channels rather than two lists that
  # were equal once.
  linux-arm64:
    name: Linux installs (arm64) shard ${{ matrix.shard }}
    needs: wait
    # Sharded because the channels are independent and were only sequential by default; round-robin
    # inside the script keeps the heavy channels (the bottle pour drags a multi-GB image) off any
    # single shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # All four shards share one VM's disk, so each keeps a small ceiling.
          CACHE_CEILING_GB: "4"
          BREW_MIRROR: "https://image-mirror.lan.bryantserver.com"
        run: bash packaging/install-matrix-arch.sh arm64 ${{ matrix.shard }} 4

  macos:
    name: macOS installs (${{ matrix.runner }})
    needs: wait
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Floor and newest on Apple Silicon. The floor is what the bottles are built on and
        # what Homebrew falls back to; the newest is what most people are actually running.
        include:
          - {runner: macos-15-vm, arch: arm64}
          - {runner: macos-27-vm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The signed .pkg — install it, and check it is really notarized
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          DL="$FORGE/SisyphusMD/dreame-valetudo/releases/download/$TAG"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 -o /tmp/d.pkg "$DL/dreame-valetudo-${VERSION}-macos-${{ matrix.arch }}.pkg"
          # Gatekeeper's own verdict, before installing. `installer` does not enforce notarization,
          # so installing successfully proves nothing about whether a user double-clicking it would
          # be allowed to.
          spctl -a -vvv -t install /tmp/d.pkg 2>&1 | tee /tmp/spctl.txt
          grep -qi "accepted" /tmp/spctl.txt
          grep -qi "notarized" /tmp/spctl.txt || { echo "::error::pkg is signed but NOT notarized"; exit 1; }
          pkgutil --check-signature /tmp/d.pkg | head -5
          sudo installer -pkg /tmp/d.pkg -target /
          bash packaging/installed-smoke.sh /usr/local/bin/dreame-valetudo "$VERSION"
      - name: The Homebrew bottle — pour it, and prove it was poured
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          # The .pkg put a binary at /usr/local/bin; remove it so the smoke that follows is
          # unambiguously exercising the brew install.
          sudo rm -f /usr/local/bin/dreame-valetudo
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          brew update --quiet >/dev/null 2>&1
          brew tap sisyphusmd/tap "$FORGE/SisyphusMD/homebrew-tap.git" >/dev/null 2>&1
          # Homebrew refuses to LOAD a formula from an untrusted third-party tap, and installing the rc
          # loads the stable one its `conflicts_with` names. Guarded on the subcommand existing: an older
          # Homebrew has no `trust` and needs none, while one that exists and fails must stop the job.
          if brew commands 2>/dev/null | tr ' ' '\n' | grep -qx trust; then brew trust sisyphusmd/tap; fi
          brew install "sisyphusmd/tap/$FORMULA" > /tmp/i.log 2>&1 || { tail -30 /tmp/i.log; exit 1; }
          # If the tap's bottle block is missing or stale, brew silently builds from source and
          # everything looks fine — slower, but green. The "Pouring" line is the direct evidence.
          grep -qi "pouring dreame-valetudo" /tmp/i.log \
            || { echo "::error::built from source instead of pouring"; grep -iE "building|installing" /tmp/i.log | head -5; exit 1; }
          # NO dependency-count heuristic, deliberately — the Linux leg carries the same note.
          # `dtc` and `pkg-config` are ordinary `depends_on`, not `:build`, so Homebrew installs
          # them for a POURED bottle too: the count grows on a perfectly correct pour. (The sibling
          # project can count, because its pkgconf and rust are `=> :build`.)
          #
          # sunxi-fel rides inside the bottle, so a poured install must already have it — this is
          # the check that proves the caveat about a first-run source build is really gone.
          test -x "$(brew --prefix)/opt/$FORMULA/libexec/tools/sunxi-fel"
          bash packaging/installed-smoke.sh "$(brew --prefix)/bin/dreame-valetudo" "$VERSION"
      - name: PyPI via uv tool
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          brew uninstall --force "$FORMULA" >/dev/null 2>&1 || true
          # PEP 440: the tag says 0.3.0-rc.1, PyPI normalizes it to 0.3.0rc1.
          PYPI_V="$(printf '%s' "$VERSION" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 -o /tmp/uv-install.sh https://astral.sh/uv/install.sh
          # Written to a file, never piped: curl cannot rewind a pipe, so a retried
          # partial body would reach `sh` concatenated with the first attempt's.
          sh /tmp/uv-install.sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          printf '#!/bin/sh\nexec uvx -q --from '"'"'dreame-valetudo==%s'"'"' dreame-valetudo "$@"\n' "$PYPI_V" > /tmp/dv
          chmod +x /tmp/dv
          bash packaging/installed-smoke.sh /tmp/dv "$VERSION"

  summary:
    name: Every channel installed and ran on every platform
    needs: [linux, linux-arm64, macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          AMD64: ${{ needs.linux.result }}
          ARM64: ${{ needs.linux-arm64.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          echo "linux-amd64: $AMD64"
          echo "linux-arm64: $ARM64"
          echo "macos:       $MACOS"
          # Each named separately: a summary that only reported the worse of them would say
          # "something is broken" about a matrix whose whole job is to say WHICH thing is.
          bad=""
          [ "$AMD64" = success ] || bad="$bad Linux-amd64"
          [ "$ARM64" = success ] || bad="$bad Linux-arm64"
          [ "$MACOS" = success ] || bad="$bad macOS"
          [ -z "$bad" ] || { echo "::error::install channels are broken for $TAG:$bad"; exit 1; }
