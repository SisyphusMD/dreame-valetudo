name: Install matrix (Linux amd64)

# Installs every LINUX channel we publish ON amd64, from the PUBLISHED artifacts, and then runs
# the tool. The arm64 and macOS halves are `.github/workflows/install-matrix.yml`, because
# architecture decides the forge here: this runner is amd64, GitHub has the native arm64 and macOS
# ones, and nothing is emulated anywhere.
#
# WHY IT EXISTS. Until this, the only thing that installed a real release was package-smoke — one
# .deb, one distro. That was defensible while the only channel was "download a file". It stopped
# being defensible when this project gained an apt/dnf REPOSITORY and a Homebrew bottle: a
# repository is a URL every subscriber's package manager resolves on every update, and a bottle
# silently falls back to a source build when its checksums are stale. Neither had anything
# proving it worked. Ported from the sibling project, whose matrix had covered this for months.
#
# Every channel is a buildx target rather than a `docker run`, because the job itself runs in a
# container and a bind mount of the workspace is invisible to the daemon. BuildKit streams its
# context instead, so there is nothing to mount. What each channel does lives in
# packaging/install-smoke.Dockerfile, and the channel LIST lives in
# packaging/install-matrix-arch.sh so the two architectures cannot test different sets.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests. What it gates is
# the next STABLE cut.

on:
  push:
    tags: ["v*.*.*"]
  # Dispatchable with an explicit tag, the same shape as bottles.yml: when the reason to re-run is
  # a fix to these scripts, a dispatch at the tag would faithfully re-run the old ones.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.3.0-rc.18"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: forgejo.bryantserver.com

jobs:
  wait:
    # The tag is in the JOB name because that is the only place Forgejo keeps it: a dispatched run's
    # title is just the workflow name, and a tag push's is the commit message.
    name: Wait for ${{ inputs.tag || github.ref_name }} to be installable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Waits on the same asset-role table reconcile replicates, so a new artifact is added in
          # one place and both learn about it.
          # The tap formula too, because one leg pours a bottle. A stable tag writes the
          # `dreame-valetudo` formula; a candidate writes only `dreame-valetudo-rc`.
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          bash packaging/wait-for-release.sh "$TAG" "$FORMULA"

  linux:
    name: Linux installs (amd64)
    needs: wait
    # NO QEMU setup, and no arm64 leg: this runner is amd64, the script refuses to build for
    # anything else, and the arm64 half runs natively on GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # The self-hosted runner's dind volume; its own idle pruner keeps 25 GiB free, so a
          # third of the volume leaves room for the images the channels pull beside the cache.
          CACHE_CEILING_GB: "20"
          # Self-hosted only: the hosted runners are not on this network. Homebrew keeps the
          # /v2/homebrew/core path and rewrites only scheme and host, so the registry serves
          # that namespace at its root specifically for this.
          BREW_MIRROR: "https://image-mirror.nas.bryantserver.com"
        run: bash packaging/install-matrix-arch.sh amd64

  summary:
    name: Every Linux amd64 channel installed and ran
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - run: echo "every Linux channel installed and ran on amd64"
