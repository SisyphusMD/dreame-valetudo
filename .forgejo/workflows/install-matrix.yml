name: Install matrix (Linux)

# Installs every LINUX channel we publish, from the PUBLISHED artifacts, and then runs the tool.
# The macOS half is covered by .github/workflows/ci-macos.yml and the release job's own package
# test, because Forgejo has no macOS runner.
#
# WHY IT EXISTS. Until this, the only thing that installed a real release was package-smoke — one
# .deb, one distro. That was defensible while the only channel was "download a file". It stopped
# being defensible when this project gained an apt/dnf REPOSITORY and a Homebrew bottle: a
# repository is a URL every subscriber's package manager resolves on every update, and a bottle
# silently falls back to a source build when its checksums are stale. Neither had anything
# proving it worked. Ported from the sibling project, whose matrix had covered this for months.
#
# Every channel is a buildx target rather than a `docker run`, for the two reasons publish.yml
# already hit on this runner: `docker run --platform arm64` dies with `exec format error` because
# the host has no usable binfmt, and a bind mount of the workspace is invisible to the daemon
# because the job itself runs in a container. BuildKit carries its own QEMU and streams its
# context, so both go away. What each channel does lives in packaging/install-smoke.Dockerfile.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests. What it gates is
# the next STABLE cut.

on:
  push:
    tags: ["v*.*.*"]
  # Dispatchable with an explicit tag, the same shape as bottles.yml: when the reason to re-run is
  # a fix to these scripts, a dispatch at the tag would faithfully re-run the old ones.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.3.0-rc.18"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: forgejo.bryantserver.com

jobs:
  wait:
    # The tag is in the JOB name because that is the only place Forgejo keeps it: a dispatched run's
    # title is just the workflow name, and a tag push's is the commit message.
    name: Wait for ${{ inputs.tag || github.ref_name }} to be installable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Waits on the same asset-role table reconcile replicates, so a new artifact is added in
          # one place and both learn about it.
          # The tap formula too, because one leg pours a bottle. A stable tag writes the
          # `dreame-valetudo` formula; a candidate writes only `dreame-valetudo-rc`.
          case "$TAG" in
            *-rc.*) FORMULA=dreame-valetudo-rc ;;
            *)      FORMULA=dreame-valetudo ;;
          esac
          bash packaging/wait-for-release.sh "$TAG" "$FORMULA"

  linux:
    name: Linux installs (${{ matrix.arch }})
    needs: wait
    runs-on: ubuntu-latest
    strategy:
      # One architecture failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, platform: linux/amd64, deb: amd64, rpm: x86_64}
          - {arch: arm64,  platform: linux/arm64, deb: arm64, rpm: aarch64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # The action's own default is tonistiigi/binfmt:latest — the one moving tag left in this
          # chain, so it is pinned here like every other image.
          # renovate: datasource=docker depName=tonistiigi/binfmt
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH_DEB: ${{ matrix.deb }}
          ARCH_RPM: ${{ matrix.rpm }}
        run: |
          set -uo pipefail
          # deb/rpm carry the tilde spelling; everything else uses the tag's.
          PKGVER="${VERSION/-rc./~rc.}"
          # GitHub rewrites `~` to `.` in the STORED asset name, so the same package has a different
          # filename there than on Forgejo. The deb-file-github target downloads the name a README
          # reader would actually construct.
          GH_PKGVER="${PKGVER//\~/.}"
          GH_DL="https://github.com/SisyphusMD/dreame-valetudo/releases/download/$TAG"
          # publish-registry.sh puts a candidate in `testing` and a release in BOTH, so a stable tag
          # has to be installed from `stable` — testing it through `testing` would leave the
          # distribution real users are on unexercised by a matrix that claims to cover every channel.
          # The .repo file follows the distribution: a candidate is published only to `testing`,
          # so installing the stable .repo would fetch the previous release or nothing at all.
          case "$TAG" in
            *-rc.*) DIST=testing; REPOFILE=sisyphusmd-testing.repo ;;
            *)      DIST=stable;  REPOFILE=sisyphusmd.repo ;;
          esac
          echo "installing from the '$DIST' distribution, for $PLATFORM"

          # The bottle is poured on x86_64 only: the linuxbrew image has no arm64 build, and the
          # arm64 bottle is proven by the macOS legs and by bottle-block.py refusing a partial set.
          channels="deb-file deb-lifecycle deb-file-github deb-file-floor deb-file-ubuntu-floor rpm-file apt-repo dnf-repo tarball uv-tool pipx"
          [ "$ARCH_DEB" = amd64 ] && channels="$channels bottle-pour"

          failed=""
          for channel in $channels; do
            echo "──────── $channel"
            rm -rf "out/$channel"
            ok=""
            if docker buildx build --platform "$PLATFORM" \
                 -f packaging/install-smoke.Dockerfile \
                 --target "${channel}-result" \
                 --output "type=local,dest=out/$channel" \
                 --build-arg V="$VERSION" --build-arg PV="$PKGVER" \
                 --build-arg DL="https://$FORGE/SisyphusMD/dreame-valetudo/releases/download/$TAG" \
                 --build-arg DIST="$DIST" --build-arg REPOFILE="$REPOFILE" \
                 --build-arg FORGE="$FORGE" \
                 --build-arg ARCH_DEB="$ARCH_DEB" --build-arg ARCH_RPM="$ARCH_RPM" \
                 --build-arg TAG="$TAG" \
                 --build-arg GH_DL="$GH_DL" --build-arg GH_PV="$GH_PKGVER" .; then
              # The exported FILE, not merely the exit status: the marker is the only thing that
              # cannot be produced by a build that did nothing.
              [ -f "out/$channel/passed" ] && ok=1
            fi
            if [ -n "$ok" ]; then echo "  → $channel OK"; else failed="$failed $channel"; fi
          done

          echo
          if [ -n "$failed" ]; then echo "::error::Linux channels failed:$failed"; exit 1; fi
          echo "every Linux channel installed and passed the smoke on $ARCH_DEB"

  summary:
    name: Every Linux channel installed and ran
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - run: echo "every Linux channel installed and ran on both architectures"
