name: Release (macOS pkg)

# Builds a SELF-CONTAINED, signed + notarized .pkg for Apple Silicon that
# bundles a prebuilt sunxi-fel, a PyInstaller'd fastboot client, and libusb,
# so an Apple Silicon Mac user double-clicks and gets a working `dreame-valetudo` with
# nothing else to install. It is built on the macOS 15 VM (the floor), installed and exercised
# there and on the newest-macOS VM, and the publish job appends it to all three releases.
#
# Its own workflow rather than a job in publish.yml, so reconcile's wait for the .pkg is the only
# coupling, and so the frozen interpreter below keeps a file of its own for Renovate to treat
# differently (see .renovaterc.json).
#
# NOTE: the native-library bundling + codesign is the one piece that can't be dry-run off-CI.
on:
  push:
    # Stable and prerelease (v1.2.3-rc.N) tags both build the signed .pkg; the publish step marks
    # prereleases via the release helper.
    tags: ["v*.*.*", "v*.*.*-*"]

  # A repair path for a .pkg leg that failed on a published tag: Forgejo has no rerun endpoint.
  # The tag is an input, and every checkout below resolves it only under refs/tags/, so a dispatch
  # can rebuild an existing tag with the Apple identity in scope and never a branch's scripts.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the .pkg for, e.g. v1.2.3-rc.4"
        required: true
        type: string

# The tag reaches every `run:` as an environment value, never as `${{ }}` inside a script.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Keyed per tag, so a dispatched rebuild of one tag never displaces another tag's publish.
concurrency:
  group: release-macos-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test signed pkg (${{ matrix.arch }}, macOS 15 floor)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-vm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # Retried in-step: Forgejo has no rerun endpoint, and a transient versions-manifest fetch
      # failure would otherwise cost the whole candidate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_1
        continue-on-error: true
        with:
          # renovate: datasource=github-tags depName=python/cpython versioning=pep440
          python-version: "3.15.2"   # exact interpreter frozen into the bundle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          # renovate: datasource=github-tags depName=python/cpython versioning=pep440
          python-version: "3.15.2"   # exact interpreter frozen into the bundle

      - name: Install, test, and uninstall the Homebrew release formula
        run: bash packaging/test-homebrew-formula.sh "$TAG"

      - name: Build sunxi-fel + the PyInstaller fastboot client
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          brew install libusb dtc pkg-config libevent
          read_pin() { python3 -c "import re; print(re.search(r'$1 = \"([^\"]+)\"', open('src/dreame_valetudo/constants.py').read()).group(1))"; }
          # sunxi-fel builds native to the runner from the package's single source-of-truth pin.
          SREF="$(read_pin SUNXI_TOOLS_REF)"
          git clone https://github.com/linux-sunxi/sunxi-tools.git /tmp/sunxi-tools
          git -C /tmp/sunxi-tools checkout "$SREF"
          make -C /tmp/sunxi-tools sunxi-fel
          cp /tmp/sunxi-tools/sunxi-fel .
          # Self-contained native binaries (python + the package / pyusb frozen in).
          python -m pip install --upgrade pip
          # renovate: datasource=pypi depName=pyinstaller
          python -m pip install pyinstaller==6.22.3
          PYUSB="$(read_pin PYUSB_VERSION)"
          python -m pip install "pyusb==$PYUSB"
          rm -rf dist
          bash packaging/build-bundle.sh "$PWD/dist"           # main tool bundle (Python frozen in)
          bash packaging/build-fastboot-client.sh "$PWD/dist"  # dreame-fastboot client (pyusb frozen in)
          cp dist/dreame-valetudo dist/dreame-fastboot .
          # tmux: every run is wrapped in a session, and a .pkg install has no package manager to
          # supply one. Built against the SYSTEM ncurses (every Mac has it, and its terminfo), so
          # only libevent has to travel with the bundle. utf8proc is explicitly disabled: tmux's
          # configure refuses to guess on macOS, and enabling it would add a Homebrew dylib to the
          # bundle for marginal Unicode width tables.
          TMUX="$(read_pin TMUX_VERSION)"
          TMUX_SHA="$(read_pin TMUX_SHA256)"
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${TMUX}/tmux-${TMUX}.tar.gz" -o /tmp/tmux.tgz
          printf '%s  %s\n' "$TMUX_SHA" /tmp/tmux.tgz | shasum -a 256 -c -
          tar -xzf /tmp/tmux.tgz -C /tmp
          (cd "/tmp/tmux-${TMUX}" && ./configure --disable-utf8proc >/dev/null && make -j3 >/dev/null)
          cp "/tmp/tmux-${TMUX}/tmux" .

      - name: Bundle libusb next to the native binaries
        run: |
          set -euo pipefail
          LIBUSB="$(brew --prefix libusb)/lib/libusb-1.0.0.dylib"
          cp "$LIBUSB" ./libusb-1.0.0.dylib
          chmod u+w ./libusb-1.0.0.dylib
          # Point sunxi-fel's libusb reference at the co-located copy; the absolute Homebrew path
          # will not exist on a user's Mac. PyInstaller separately embeds libusb in dreame-fastboot.
          OLD="$(otool -L sunxi-fel | awk '/libusb-1.0/{print $1; exit}')"
          install_name_tool -change "$OLD" "@loader_path/libusb-1.0.0.dylib" sunxi-fel
          install_name_tool -id "@loader_path/libusb-1.0.0.dylib" ./libusb-1.0.0.dylib
          # Every OTHER non-system dependency, for both native binaries: tmux drags in libevent,
          # and sunxi-fel links libfdt from dtc. Hand-rewriting one reference per binary is what
          # left sunxi-fel pointing at a Homebrew libfdt that does not exist on a user's Mac — the
          # exact machine the .pkg is for. The helper walks the whole chain instead, and skips the
          # @loader_path reference set just above.
          bash packaging/bundle-macos-dylibs.sh ./tmux .
          bash packaging/bundle-macos-dylibs.sh ./sunxi-fel .
          # Nothing may still point into Homebrew by the time this is packaged.
          for b in ./tmux ./sunxi-fel ./*.dylib; do
            if otool -L "$b" | tail -n +2 | grep -qE '^\s+(/opt/homebrew|/usr/local/(opt|Cellar))'; then
              echo "::error::$b still references a Homebrew path:"; otool -L "$b"; exit 1
            fi
          done

      # The same tag grammar every other release step enforces, before anything reads the identity.
      - name: Validate the tag before the signing identity comes into scope
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . packaging/release-common.sh
          rel_validate_tag "$TAG"

      - name: Import signing certificates
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f app.p12 installer.p12' EXIT
          # Outside the workspace and removed by the last step: the signing identities must not
          # outlive this job on the VM.
          KEYCHAIN="${RUNNER_TEMP:-/tmp}/build.keychain"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "" "$KEYCHAIN"
          # Every job starts with no default keychain and an empty search list, so both are set here.
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APP_CERT_P12" | base64 -d > app.p12
          echo "$INSTALLER_CERT_P12" | base64 -d > installer.p12
          security import app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import installer.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Sign, assemble, package, notarize, staple
        env:
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          trap 'rm -f notary.p8' EXIT
          VERSION="${TAG#v}"
          # Versioned, like every other asset and like whiskerless's: two .pkg downloads in
          # ~/Downloads that cannot be told apart is a real cost, and the second overwrites
          # the first. reconcile matches by role, so older releases keep their old names.
          PKG="dreame-valetudo-${VERSION}-macos-${{ matrix.arch }}.pkg"
          # Sign the native Mach-O bits with the hardened runtime (required for notarization).
          for f in ./*.dylib tmux sunxi-fel dreame-fastboot dreame-valetudo; do
            bash packaging/retry.sh 5 codesign --force --options runtime --timestamp \
              --entitlements packaging/entitlements.plist --sign "$APP_IDENTITY" "$f"
          done
          # Lay out the install tree: native binaries in libexec, a thin wrapper in bin. The main
          # bundle has fastboot-libusb.py + the form baseline frozen in (via _MEIPASS), so libexec
          # only needs the native helpers + the co-located libusb.
          LX=root/usr/local/libexec/dreame-valetudo
          mkdir -p "$LX" root/usr/local/bin
          cp dreame-valetudo dreame-fastboot sunxi-fel tmux ./*.dylib "$LX/"
          # macOS cannot uninstall a .pkg; ship the remover beside what it removes.
          install -m 0755 packaging/uninstall-macos.sh "$LX/uninstall.sh"
          cat > root/usr/local/bin/dreame-valetudo <<'SH'
          #!/bin/bash
          export DREAME_LIBEXEC="/usr/local/libexec/dreame-valetudo"
          exec "/usr/local/libexec/dreame-valetudo/dreame-valetudo" "$@"
          SH
          chmod +x root/usr/local/bin/dreame-valetudo "$LX/dreame-valetudo"
          pkgbuild --root root --identifier com.sisyphusmd.dreame-valetudo \
            --version "$VERSION" --install-location / unsigned.pkg
          bash packaging/retry.sh 5 productsign --sign "$INSTALLER_IDENTITY" unsigned.pkg "$PKG"
          echo "$NOTARY_KEY_P8" | base64 -d > notary.p8
          bash packaging/retry.sh 5 xcrun notarytool submit "$PKG" \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          bash packaging/retry.sh 5 xcrun stapler staple "$PKG"
          # Later steps in this job need the exact name; expressions cannot strip the `v`.
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Install, exercise, and uninstall the signed package
        run: >-
          bash packaging/test-macos-package.sh
          "${{ env.PKG }}"
          "${{ matrix.arch }}" "${TAG#v}"

      - uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: pkg-${{ matrix.arch }}
          path: ${{ env.PKG }}

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

  current:
    name: Test floor-built pkg (${{ matrix.arch }}, newest macOS)
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-27-vm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: pkg-${{ matrix.arch }}
          path: .
      - name: Install, exercise, and uninstall the floor-built signed package
        run: |
          set -euo pipefail
          # A separate job, so the build job's $GITHUB_ENV is gone and the name must be recovered.
          # Exactly one .pkg is downloaded here; refuse rather than test an arbitrary one.
          shopt -s nullglob
          pkgs=(*-macos-${{ matrix.arch }}.pkg)
          [ "${#pkgs[@]}" -eq 1 ] || { echo "::error::expected 1 pkg, found ${#pkgs[@]}"; exit 1; }
          bash packaging/test-macos-package.sh \
            "${pkgs[0]}" "${{ matrix.arch }}" "${TAG#v}"

  publish:
    name: Append the signed .pkg to the three releases
    needs: [build, current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59 # v3.1.0
        with:
          name: pkg-arm64
          path: pkgs
      - name: Append the .pkg to the three releases
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          bash packaging/changelog-section.sh "${TAG#v}" > notes.md
          chmod +x packaging/github-release.sh packaging/forgejo-release.sh
          # Every destination is attempted whatever the others did, then failures are re-raised,
          # the shape every publishing job here uses (#76). The NAS is written directly: this
          # runner reaches it, so nothing has to bridge the .pkg there afterwards.
          failed=""
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "$CLUSTER_TOKEN" "$TAG" notes.md pkgs/*.pkg || failed="$failed forgejo.bryantserver.com"
          packaging/github-release.sh "$GH_TOKEN" \
            "$TAG" notes.md pkgs/*.pkg || failed="$failed github.com"
          packaging/forgejo-release.sh forgejo.lan.bryantserver.com \
            "$NAS_TOKEN" "$TAG" notes.md pkgs/*.pkg || failed="$failed forgejo.lan.bryantserver.com"
          if [ -n "$failed" ]; then
            echo "::error::.pkg publishing failed for:$failed"
            exit 1
          fi
