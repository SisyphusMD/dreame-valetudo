name: Release

# Cut a release from main: pick the bump in the Forgejo UI. Advances the CHANGELOG, bumps the
# project version records, runs the lint/smoke gate, then commits + tags. The tag triggers
# publish.yml (the .deb + tarball + the forgejo/nas/github releases) and, on the GitHub mirror,
# the signed macOS .pkg job.
#
# Split in two on purpose. `gate` decides what the release IS and proves the tree is green, holding
# no credential at all. `tag` is the only job handed the write token: it re-derives the same edits
# from a fresh checkout and refuses to push unless the resulting bytes hash to what the gate
# qualified — so a compromised lint/test dependency can influence neither the release contents nor
# the push.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  # Stable and RC tag creation share one producer slot. Tag publishing has a per-tag group of its
  # own: sharing this group could displace a queued publish run before it ever builds its assets.
  group: release-cut
  cancel-in-progress: false

jobs:
  gate:
    name: Qualify release intent (secret-free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      release_date: ${{ steps.ver.outputs.release_date }}
      intent_sha256: ${{ steps.intent.outputs.sha256 }}
    steps:
      - name: Refuse non-main dispatches
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Release must be dispatched from main; got '${{ github.ref_name }}'"
            exit 1
          fi

      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shellcheck every shipped and integration script
        run: bash packaging/shellcheck-all.sh

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          # The date is qualified here and replayed by the tag job: "today" must not differ between
          # the two runners, or the reproduced CHANGELOG would not match the qualified bytes.
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"   # range base for the dependency-bump notes
          echo "Releasing ${version} (bump=${BUMP}, previous=${previous:-none})"

      - name: Sanity guards
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          grep -qE '^## \[Unreleased\]' CHANGELOG.md || { echo "::error::Missing '## [Unreleased]'"; exit 1; }
          ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG already has [${VERSION}]"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || { echo "::error::Tag ${TAG} exists"; exit 1; }

      - name: Enforce the pre-0.4 release boundary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 packaging/check-release-boundary.py "$VERSION"

      - name: Detect dependency bumps since the previous release (latest per dep)
        id: deps
        env:
          PREV: ${{ steps.ver.outputs.previous }}
        run: |
          set -euo pipefail
          DEPS=$(bash packaging/dependency-bumps.sh "$PREV")
          if [ -z "$PREV" ]; then
            echo "first release — no dependency-update notes"
          else
            echo "dependency bumps to note:"; echo "${DEPS:-<none>}"
          fi
          {
            echo 'deps<<DEPS_EOF'
            [ -n "$DEPS" ] && echo "$DEPS"
            echo 'DEPS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Promote [Unreleased] in CHANGELOG (+ append the dependency bumps)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEPS: ${{ steps.deps.outputs.deps }}
          RELEASE_DATE: ${{ steps.ver.outputs.release_date }}
        run: bash packaging/promote-changelog.sh "$VERSION" "$RELEASE_DATE"

      - name: Bump the version (pyproject + package + uv.lock)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 packaging/stamp-version.py "$VERSION"
          python3 packaging/stamp-version.py "$VERSION" --check

      - name: Point README download links at this release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Rewrite the version segment of every releases/download/<ver>/ link (forgejo + github,
          # .pkg + both .debs) to this tag. Bootstraps from the literal 'VERSION' placeholder.
          sed -i -E "s#(releases/download/)[^/]+/#\1${TAG}/#g" README.md
          grep -q "releases/download/${TAG}/" README.md || { echo "::error::README link rewrite did not apply"; exit 1; }

        # Retried in-step, the shape publish.yml and tap-bottles.yml already use: a transient
        # versions-manifest fetch failure has taken every job of a run down together before now, and
        # Forgejo exposes no rerun endpoint, so recovery has to happen inside the job. The guard is
        # `!= 'success'`, not `== 'failure'`: if a runner ever leaves `outcome` unset, an equality
        # test would silently skip the retry AND `continue-on-error` would have swallowed the first
        # failure, letting later steps run against whatever interpreter happened to be present.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14.7"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14.7"

      - name: Snapshot the exact intended release diff
        id: intent
        run: |
          set -euo pipefail
          # The release is exactly these five files and nothing else. Hashing the patch here, before
          # any third-party tool is installed, is what the tag job later reproduces byte-for-byte.
          printf '%s\n' CHANGELOG.md README.md src/dreame_valetudo/__init__.py pyproject.toml uv.lock \
            | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/intended-release.patch"
          sha256sum "$RUNNER_TEMP/intended-release.patch" \
            | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Test gate (lint + typecheck + unit + integration)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=ruff
          RUFF="0.16.5"
          # renovate: datasource=pypi depName=mypy
          MYPY="2.3.1"
          # renovate: datasource=pypi depName=pytest
          PYTEST="9.1.1"
          # renovate: datasource=pypi depName=pytest-cov
          PYTEST_COV="7.1.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          # renovate: datasource=pypi depName=pyyaml
          PYYAML="6.0.3"
          python -m pip install --upgrade pip
          pip install "ruff==$RUFF" "mypy==$MYPY" "pytest==$PYTEST" "pytest-cov==$PYTEST_COV" "pyyaml==$PYYAML" -e .
          # The shipped tool: lint, typecheck, unit tests, and the version-of-record.
          ruff check src/dreame_valetudo libexec tests/python packaging/stamp-version.py
          mypy
          # Gated HERE too, not only in CI: ci.yml runs on a branch, and a release is cut from a
          # tag. Without this the release path was the one way a coverage regression could ship.
          pytest -q tests/python --cov --cov-report=term-missing --cov-fail-under=99
          # The Runner seam every external command funnels through, held at 100 separately so a
          # regression there cannot hide inside the repository average.
          coverage report --include='*/run.py' --fail-under=100
          python -c "import re,sys; v=re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1); sys.exit(0 if v=='${VERSION}' else 1)"
          python -m dreame_valetudo version | grep -q "dreame-valetudo ${VERSION}"
          python -m dreame_valetudo help | grep -q "Supported models"
          # `build`, so release-scripts.sh exercises the tap section instead of skipping it.
          # CONVENTIONS 6c: a gate that only really runs in ci.yml does not constrain a release.
          python3 -m pip install --upgrade build
          for t in tests/release/*.sh; do bash "$t"; done

      - name: Prove the test toolchain changed no release byte
        run: |
          set -euo pipefail
          git diff --binary | cmp - "$RUNNER_TEMP/intended-release.patch"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

  candidate-gate:
    name: Qualify the candidate this release promotes (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # next-version.sh derives the version from the TAGS. A default shallow checkout has none,
          # so it would fall back to 0.0.0, ask about a version that has no candidates, and report
          # "nothing to check" — a gate that passes hardest exactly when it is broken.
          fetch-depth: 0
          persist-credentials: false
      - name: Require the last rc's install matrix to be green
        # The install matrix installs PUBLISHED artifacts, so it can only ever run after a release
        # and can never gate the one it tests. This is where it earns its keep: a candidate whose
        # apt, dnf, Homebrew, .pkg or tarball install is broken must not become the stable, and
        # noticing that should not depend on somebody remembering to open the right tab.
        #
        # This workflow said the matrix "gates the next stable cut" while nothing read its result.
        # Reads only, and takes an optional read-only token for the same rate-limit reason the
        # sibling's does.
        env:
          BUMP: ${{ inputs.bump }}
          GH_REPO_READ_PAT: ${{ secrets.GH_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          # Belt to fetch-depth's braces: if the tags did not arrive, every version this could
          # compute is fiction.
          git tag -l 'v*.*.*' | grep -q . || { echo "::error::no tags in this checkout"; exit 1; }
          version="$(bash packaging/next-version.sh "$BUMP" | sed -n 's/^version=//p')"
          [ -n "$version" ] || { echo "::error::could not compute the version being promoted"; exit 1; }
          bash packaging/check-rc-install-matrix.sh "$version"

  mirror-gate:
    name: Qualify the mirror's macOS checks on the source commit (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the mirror's macOS CI to be green on the source commit
        # This forge has no macOS runner, so nothing here can run the suite on a Mac. ci.yml waits
        # for the mirror's verdict per pull request, which leaves main reachable by anything that
        # did not go through one — a direct push, an infra failure someone retried, a run that went
        # red after merge. Cutting from main is exactly when that matters.
        #
        # The SOURCE commit, not the tagged one: the tag job stamps version strings and commits, so
        # the tagged tree is a child of this SHA and no branch workflow ever evaluates it.
        env:
          # Optional and read-only. Unauthenticated GitHub allows 60 requests an hour PER IP,
          # shared with everything else egressing from this network. A token needs NO scopes for a
          # public repo and lifts the limit to 5,000/hour. Absent, this still works, just slowly.
          # The job holds no WRITE credential either way, which is the property that matters.
          MIRROR_CI_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}
        # Both, not just one: the formula check proves the macOS install and the CI matrix
        # proves the library's own tests run on a Mac, and gating on either alone lets a release
        # be cut from a commit the other found red. Named by file: a display name is prose, and a
        # reworded one would match no runs and read as "not delivered yet".
        run: |
          bash packaging/check-mirror-ci.sh "${{ github.sha }}" .github/workflows/formula-macos.yml
          bash packaging/check-mirror-ci.sh "${{ github.sha }}" .github/workflows/ci-macos.yml

  tag:
    name: Authorize and push release tag
    needs: [gate, candidate-gate, mirror-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main dispatches
        run: |
          [ "${{ github.ref_name }}" = main ] \
            || { echo "::error::Release must be dispatched from main"; exit 1; }

      - name: Fresh checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified release intent
        env:
          BUMP: ${{ inputs.bump }}
          QUALIFIED_VERSION: ${{ needs.gate.outputs.version }}
          QUALIFIED_TAG: ${{ needs.gate.outputs.tag }}
          QUALIFIED_DATE: ${{ needs.gate.outputs.release_date }}
          QUALIFIED_INTENT_SHA256: ${{ needs.gate.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          # Same derivation as the gate, on a tree no gate step ever touched. Nothing here trusts
          # the gate beyond the version, the date, and the hash it has to match.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          [ "$version" = "$QUALIFIED_VERSION" ] && [ "$tag" = "$QUALIFIED_TAG" ] \
            || { echo "::error::qualified release intent changed between runners"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          python3 packaging/check-release-boundary.py "$version"

          DEPS=$(bash packaging/dependency-bumps.sh "$previous")
          export DEPS
          bash packaging/promote-changelog.sh "$version" "$QUALIFIED_DATE"
          python3 packaging/stamp-version.py "$version"
          sed -i -E "s#(releases/download/)[^/]+/#\1${tag}/#g" README.md
          printf '%s\n' CHANGELOG.md README.md src/dreame_valetudo/__init__.py pyproject.toml uv.lock \
            | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          ACTUAL_INTENT_SHA256=$(git diff --binary | sha256sum | awk '{print $1}')
          [ "$ACTUAL_INTENT_SHA256" = "$QUALIFIED_INTENT_SHA256" ] \
            || { echo "::error::release bytes differ from the qualified intent"; exit 1; }

      - name: Commit and tag the reproduced release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add CHANGELOG.md README.md pyproject.toml src/dreame_valetudo/__init__.py uv.lock
          git commit -m "release: ${VERSION}"
          # Fail closed: never tag a commit that doesn't actually carry the version bump.
          python3 packaging/stamp-version.py "$VERSION" --check
          git tag -a -m "release: ${VERSION}" "$TAG"

      - name: Push the commit and tag atomically
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: bash packaging/push-tag.sh "$TAG" "$TOKEN" "${{ github.ref_name }}"
