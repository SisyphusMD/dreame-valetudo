name: Publish

# Tag-triggered (from release.yml / prerelease.yml): build both .debs + the tarball and create the
# release on each forge. The GitHub mirror's release-macos.yml appends the signed .pkgs; the
# reconcile job here fans every asset out to all three registries (and backfills any historical gap).
# On a STABLE tag a final prune-rcs job (after tap + reconcile) sweeps the rc releases/tags that the
# now fully fanned-out stable supersedes. See packaging/README.md for the secrets.
on:
  push:
    # Stable (v1.2.3) and prerelease (v1.2.3-rc.N) tags both build here; the release helpers mark
    # the hyphenated ones as prereleases, and the tap job writes them to the separate -rc formula.
    tags: ["v*.*.*", "v*.*.*-*"]

concurrency:
  # Deduplicate only the same tag. A single global group keeps just one pending run, so a later tag
  # can otherwise displace an earlier tag's still-pending publication and leave it assetless.
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false


jobs:
  releases:
    name: Build .debs + tarball, create releases (Forgejo, NAS, GitHub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both .debs are built through buildx, the way the sister repos build their arm64 images: the
      # docker-container BuildKit driver carries QEMU, so the arm64 leg emulates INSIDE the builder.
      # This runner is a Talos node with no usable host binfmt for a plain `docker run --platform
      # arm64` (that gets `exec format error`); buildx sidesteps it, and its context/output are
      # client-side streams so the DinD workspace-visibility problem doesn't apply either.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # The action's own default is tonistiigi/binfmt:latest — the one moving tag left in
          # either workflow. Pin it by digest like every other image here.
          # renovate: datasource=docker depName=tonistiigi/binfmt
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's Zot mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]

      - name: Build the .debs + .rpms (buildx) + the tarball
        run: |
          set -euo pipefail
          # Read the pins from the Python constants so there's ONE source of truth (Renovate-tracked).
          read_pin() { python3 -c "import re,sys; print(re.search(r'$1 = \"([^\"]+)\"', open('dreame_valetudo/constants.py').read()).group(1))"; }
          SREF="$(read_pin SUNXI_TOOLS_REF)"; PYUSB="$(read_pin PYUSB_VERSION)"
          export VERSION="${GITHUB_REF_NAME#v}"
          export GLIBC_FLOOR
          GLIBC_FLOOR=$(cat packaging/glibc-floor.txt)
          # renovate: datasource=pypi depName=pyinstaller
          PYINSTALLER="6.21.0"
          PYTHON_VERSION="$(read_pin BUNDLE_PYTHON_VERSION)"
          PYTHON_SHA256="$(read_pin BUNDLE_PYTHON_SHA256)"
          # renovate: datasource=docker depName=quay.io/pypa/manylinux_2_28_x86_64
          MANYLINUX_AMD64="quay.io/pypa/manylinux_2_28_x86_64:2026.08.04-1@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be"
          # renovate: datasource=docker depName=quay.io/pypa/manylinux_2_28_aarch64
          MANYLINUX_ARM64="quay.io/pypa/manylinux_2_28_aarch64:2026.08.04-1@sha256:52e4da6e9348db7cd0b529a827623b62b7c1fe867ba515ae752fa13d41f7f46e"
          # nfpm packages the .debs. Pinned image; its digest IS the integrity check (Renovate-kept).
          # renovate: datasource=docker depName=goreleaser/nfpm
          NFPM="goreleaser/nfpm:v2.47.0@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c"

          # Package a laid-out arch's binaries with the pinned nfpm image. DEB_ARCH is nfpm's internal
          # arch (amd64/arm64) for BOTH formats — nfpm maps it to the .deb arch and to the .rpm arch
          # (x86_64/aarch64). nfpm runs on the amd64 runner natively (arch-independent) via docker
          # create+cp, since the DinD daemon can't bind-mount the job workspace.
          nfpm_pkg() { # nfpm_pkg <deb|rpm> <nfpm-arch amd64|arm64> <output-filename>
            local fmt="$1" narch="$2" name="$3" cid
            cid=$(docker create -e DEB_ARCH="$narch" -e VERSION -e GLIBC_FLOOR -w /w "$NFPM" package -p "$fmt" -f packaging/nfpm.yaml -t "/w/$name")
            docker cp . "$cid":/w
            docker start -a "$cid"
            docker cp "$cid":"/w/$name" .
            docker rm "$cid" >/dev/null
          }
          build_pkgs() { # build_pkgs <docker-platform> <deb-arch> <rpm-arch> <builder-image>
            local plat="$1" arch="$2" rpmarch="$3" builder="$4"
            # buildx builds the per-arch bundle (main tool + fastboot client + sunxi-fel) and exports
            # just those native binaries. The per-arch builder and source/tool pins ride in as
            # build args. The arm64 leg emulates inside the builder.
            rm -rf "out-$arch"
            docker buildx build --platform "$plat" \
              --build-arg PYTHON_BUILD_IMAGE="$builder" \
              --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
              --build-arg PYTHON_SHA256="$PYTHON_SHA256" \
              --build-arg SREF="$SREF" --build-arg PYUSB="$PYUSB" --build-arg PYINSTALLER="$PYINSTALLER" \
              -f packaging/deb.Dockerfile --target export --output "type=local,dest=out-$arch" .
            rm -rf dist && mkdir dist
            cp "out-$arch/dreame-valetudo" "out-$arch/dreame-fastboot" dist/
            cp "out-$arch/sunxi-fel" ./sunxi-fel
            nfpm_pkg deb "$arch" "dreame-valetudo_$arch.deb"
            nfpm_pkg rpm "$arch" "dreame-valetudo.$rpmarch.rpm"
          }
          build_pkgs linux/amd64 amd64 x86_64 "$MANYLINUX_AMD64"
          build_pkgs linux/arm64 arm64 aarch64 "$MANYLINUX_ARM64"
          # Install and execute the exact release packages on BOTH Linux architectures before any
          # asset is published. BuildKit carries QEMU for arm64; a plain docker run on this runner
          # cannot. The full distro upgrade matrix runs pre-merge in ci.yml on amd64.
          smoke_pkg() { # smoke_pkg <docker-platform> <deb>
            # Two statements: in one `local`, every argument expands before any assignment runs,
            # so a self-reference trips `set -u`.
            local plat="$1" package="$2"
            local result="package-smoke-${plat##*/}"
            cp "$package" package-smoke.deb
            rm -rf "$result"
            docker buildx build --platform "$plat" \
              -f packaging/package-smoke.Dockerfile --target result \
              --output "type=local,dest=$result" .
            test -f "$result/package-smoke-passed"
          }
          smoke_pkg linux/amd64 dreame-valetudo_amd64.deb
          smoke_pkg linux/arm64 dreame-valetudo_arm64.deb
          # tarball: arch-independent SOURCE channel (run via uv/pipx — no per-arch binary).
          bash packaging/build-tarball.sh
          ls -l ./*.deb ./*.rpm ./*.tar.gz

      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the three releases with the Linux assets
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          # Match the built artifacts by their real names: a bare ./*.deb also globs the
          # package-smoke.deb copy the smoke step leaves in the workspace, publishing it as a stray.
          ASSETS=(./dreame-valetudo_*.deb ./dreame-valetudo.*.rpm ./dreame-valetudo-*.tar.gz)
          fail=0
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          exit "$fail"

  homebrew-tap:
    name: Update the Homebrew tap formula (stable or -rc per tag)
    needs: releases
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fill the formula + push to the Forgejo tap (mirror carries it to GitHub + NAS)
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          # The tap is Forgejo-primary: write the formula here, and the tap's own sync_on_commit
          # push-mirror fans this commit out to GitHub (where `brew` fetches it) + NAS. A stable tag
          # writes BOTH Formula/dreame-valetudo.rb and the rc formula re-pointed at the same stable
          # tarball (fall-through, so the rc channel keeps resolving once its rc releases are pruned);
          # a prerelease tag writes only Formula/dreame-valetudo-rc.rb, so the stable formula never
          # points at a candidate build.
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" tap
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" tap
          cd tap
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "dreame-valetudo ${GITHUB_REF_NAME#v}" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push

  reconcile:
    name: Reconcile releases across registries (bridge .pkgs to NAS, heal history)
    needs: releases
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags needed for the reconcile loop
      - name: Require the current release's GitHub-built .pkgs, then reconcile every tag
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/dreame-valetudo
          # Both native GitHub build legs install and exercise their signed package before the
          # publish job can place it here. Their presence is therefore the cross-forge qualification
          # gate, not merely an asset-availability convenience.
          fail=0
          qualified=false
          for _ in $(seq 1 180); do
            qualified=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" | jq -r '
              [.assets[]?.name] as $names |
              ($names | index("dreame-valetudo-macos-arm64.pkg") != null) and
              ($names | index("dreame-valetudo-macos-x86_64.pkg") != null)
            ' 2>/dev/null || echo false)
            [ "$qualified" = true ] && break
            sleep 10
          done
          [ "$qualified" = true ] || {
            echo "::error::current tag's two GitHub-qualified .pkgs were not published within 30m"
            fail=1
          }
          chmod +x packaging/reconcile-releases.sh packaging/forgejo-release.sh packaging/github-release.sh
          bash packaging/reconcile-releases.sh || fail=1
          exit "$fail"

  prune-rcs:
    name: Prune the rc releases/tags a shipped stable supersedes (stable tags only)
    # STABLE tags only: an rc tag (hyphenated) never prunes. Runs AFTER homebrew-tap has re-pointed
    # the rc formula at the stable AND after reconcile has confirmed the stable is fanned out to all
    # three registries — the default needs-success gate means a failed reconcile (stable not fully
    # published) skips the prune, so the rc formula is never left pointing at a deleted rc.
    needs: [homebrew-tap, reconcile]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sweep every rc a fully fanned-out stable now supersedes
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          chmod +x packaging/prune-superseded-rcs.sh
          # Destructive. The deletion path is hardened against the real Forgejo/GitHub release-tag
          # model: the release is deleted before its tag, the tag ref is removed via the git-refs
          # endpoint, Forgejo's stale tag DB row is cleared via /tags/<name>, and removal is confirmed
          # by RE-READING the live list and git refs (never by trusting a 204/404), retried for
          # eventual consistency. This first fires at the 0.3.0 stable cut — its first real-registry
          # deletion — so watch that release. Warn-only: a prune problem must never fail the release or
          # make a valid stable disappear.
          bash packaging/prune-superseded-rcs.sh \
            || echo "::warning::prune-superseded-rcs exited nonzero; the stable release is unaffected"
