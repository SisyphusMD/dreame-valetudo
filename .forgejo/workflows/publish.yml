name: Publish

# Tag-triggered (from release.yml / prerelease.yml): build both .debs + the tarball and create the
# release on each forge. The GitHub mirror's release-macos.yml appends the signed .pkgs; the
# reconcile job here fans every asset out to all three registries (and backfills any historical gap).
# On a STABLE tag a final prune-rcs job (after tap + reconcile) sweeps the rc releases/tags that the
# now fully fanned-out stable supersedes. See packaging/README.md for the secrets.
on:
  # Dispatchable so a partly-failed publish can be FINISHED without cutting a new tag. Forgejo
  # exposes no rerun endpoint, so without this the only recovery from a late transient failure —
  # a mirror-timing error, one registry refusing an upload — is burning another release candidate.
  # Every helper here is idempotent (create-or-reuse the release, --skip-existing on PyPI, replace
  # assets), so re-running a partial publish completes it rather than duplicating it.
  #
  # Dispatch with the TAG as the ref. The guard job below refuses anything else, because dispatching
  # from `main` would treat "main" as the version: packages named for it, a wait for a tag that does
  # not exist, and releases called `main` created on all three hosts. Same arrangement as the sibling.
  workflow_dispatch:
  push:
    # Stable (v1.2.3) and prerelease (v1.2.3-rc.N) tags both build here; the release helpers mark
    # the hyphenated ones as prereleases, and the tap job writes them to the separate -rc formula.
    tags: ["v*.*.*", "v*.*.*-*"]

concurrency:
  # Deduplicate only the same tag. A single global group keeps just one pending run, so a later tag
  # can otherwise displace an earlier tag's still-pending publication and leave it assetless.
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false


jobs:
  guard:
    name: Refuse anything that is not a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: |
          set -euo pipefail
          # Both tag shapes this workflow publishes; anything else is a dispatch mistake, and it is
          # cheaper to refuse it here than to unpick releases named `main` from three registries.
          # The SAME grammar every other release step enforces, not a glob. `v0.3.0.dev1`
          # matches `v*.*.*` and is rejected by rel_validate_tag — and by every helper
          # downstream — so a glob here lets a dispatch start the PyPI upload and the builds
          # before anything refuses it.
          case "${GITHUB_REF}" in
            refs/tags/*) : ;;
            *) echo "::error::${GITHUB_REF} is not a tag — dispatch this with a release tag as the ref" >&2; exit 1 ;;
          esac
          # shellcheck source=/dev/null
          . packaging/release-common.sh
          rel_validate_tag "${GITHUB_REF_NAME}"
          echo "publishing ${GITHUB_REF_NAME}"

  pypi:
    name: Publish to PyPI
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step, the shape the sibling uses: a transient versions-manifest fetch failure
      # has taken every job of a release down together before now, and Forgejo exposes no rerun
      # endpoint, so recovery has to happen inside the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Build + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build
          # Idempotent: a partial upload has to stay retryable, or the tap job below waits on a
          # file that will never appear.
          twine upload --skip-existing dist/*

  releases:
    name: Build .debs + tarball, create releases (Forgejo, NAS, GitHub)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NO QEMU. This runner is amd64 and builds only amd64; arm64 is built on a native arm64
      # runner (.github/workflows/release-linux-arm64.yml). buildx is still used because its
      # context and output are client-side streams, which dodges the workspace-visibility problem
      # a bind mount hits when the job itself runs in a container — not because anything emulates.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's Zot mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]

      - name: Build the amd64 .deb, .rpm and tarball (native — nothing is emulated here)
        id: build
        env:
          # Step-local, not job-wide: the key is needed by exactly this step, and a job-level
          # secret is visible to every other one.
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # The build-time pins live in packaging/release-pins.env and the script sources them
          # itself — one file, because the arm64 half of this release is built on GitHub and two
          # inline copies would drift the first time one was bumped.
          #
          # amd64 ONLY. arm64 is built natively by .github/workflows/release-linux-arm64.yml and
          # appended to this release afterwards — this runner is amd64, and emulating arm64 here
          # is what cost rc.13 its Linux assets. build-linux-arch.sh refuses a host/target
          # mismatch rather than silently emulating, so that cannot come back by accident.
          bash packaging/build-linux-arch.sh amd64 "$GITHUB_REF_NAME"
          # The arch-independent SOURCE tarball the Homebrew formula builds from. Built here rather
          # than in the per-arch script precisely because it is not per-arch: building it twice
          # would mean two forges racing to publish two copies of one artifact.
          bash packaging/build-tarball.sh

      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the three releases with the Linux assets
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          # Match the built artifacts by their real names: a bare ./*.deb also globs the
          # package-smoke.deb copy the smoke step leaves in the workspace, publishing it as a stray.
          # Assets carry the version, as whiskerless's always have: two downloads in ~/Downloads
          # that cannot be told apart, where the second silently overwrites the first, is a real
          # cost paid by users. reconcile matches by ROLE rather than constructed name, so older
          # releases keep their versionless names without special-casing.
          # The amd64 artifacts this runner built, plus the arch-independent source tarball. The
          # arm64 ones are appended to this same release by the native arm64 job on GitHub, the way
          # the macOS .pkg already is — so a glob for them here would either match nothing or race
          # that job.
          ASSETS=(
            ./dreame-valetudo_*_amd64.deb
            ./dreame-valetudo-*.x86_64.rpm
            ./dreame-valetudo-*-linux-amd64.tar.gz
          )
          # The SOURCE tarball is named without a `-linux-<arch>` segment, so it needs its own
          # entry: a glob loose enough to catch it also catches the arm64 bundle this job does not
          # have. extglob rather than a second broad pattern, for exactly that reason.
          shopt -s extglob
          ASSETS+=(./dreame-valetudo-!(*-linux-*).tar.gz)
          fail=0
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          exit "$fail"

  registry:
    name: Publish .deb/.rpm into the apt/dnf repositories
    needs: [guard, releases]
    # Runs even when a release UPLOAD failed — the repository is a fourth destination with its own
    # failure modes, and a job publishing to independent places must not let the first failure skip
    # the rest.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect BOTH architectures, then publish
        # A repository is not a release page: whatever lands there is what `apt install` hands
        # people immediately, with no way to tell the set is short. publish-registry.sh refuses a
        # partial set for that reason, and since arm64 moved to a native GitHub runner this job's
        # own workspace holds only half of it — so it reads the full set off the release both
        # forges publish to, and fails rather than publishing half.
        run: |
          set -euo pipefail
          chmod +x packaging/publish-registry.sh packaging/fetch-release-assets.sh
          select='.assets[]? | select(
                    (.name | endswith("_amd64.deb"))
                    or (.name | endswith("_arm64.deb"))
                    or (.name | endswith(".x86_64.rpm"))
                    or (.name | endswith(".aarch64.rpm"))
                  ) | .browser_download_url'
          # No `|| true`: an incomplete set must stop this job, not be published.
          packaging/fetch-release-assets.sh "$GITHUB_REF_NAME" 4 "$select"
          # A SEPARATE token from the release PAT: Forgejo scopes the package registry on its own,
          # and `write:repository` — everything the release helpers need — cannot upload a package.
          packaging/publish-registry.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}" "$GITHUB_REF_NAME" \
            ./dreame-valetudo_*.deb ./dreame-valetudo-*.rpm

  homebrew-tap:
    name: Update the Homebrew tap formula (stable or -rc per tag)
    # The formula's url and checksum come from the PyPI sdist, so this cannot run before the
    # upload. Declared rather than polled: both jobs are on this forge.
    # Shared with homebrew-bottles and tap-bottles.yml: three jobs write this one repository, and
    # two of them cloning the same tip means the loser pushes a non-fast-forward and the tap keeps
    # whichever block lost the race.
    concurrency:
      group: tap-write
      cancel-in-progress: false
    needs: [guard, releases, pypi]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fill the formula + push to the Forgejo tap (mirror carries it to GitHub + NAS)
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          # The tap is Forgejo-primary: write the formula here, and the tap's own sync_on_commit
          # push-mirror fans this commit out to GitHub (where `brew` fetches it) + NAS. A stable tag
          # writes BOTH Formula/dreame-valetudo.rb and the rc formula re-pointed at the same stable
          # tarball (fall-through, so the rc channel keeps resolving once its rc releases are pruned);
          # a prerelease tag writes only Formula/dreame-valetudo-rc.rb, so the stable formula never
          # points at a candidate build.
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" tap
          # update-tap.sh builds the sdist locally to derive the checksum, so the build
          # frontend has to be here. The PyPI job installs it too, but jobs do not share
          # an environment — and the failure is `No module named build`, mid-release.
          python -m pip install --upgrade pip build
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" tap
          cd tap
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "dreame-valetudo ${GITHUB_REF_NAME#v}" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push

  homebrew-bottles:
    name: Add the bottle block to the tap (second pass)
    concurrency:
      group: tap-write
      cancel-in-progress: false
    # The tap must already hold this version (the bottles were built by
    # installing it) and the release must exist (the bottles are its assets).
    needs: [guard, homebrew-tap, releases]
    # `releases` going red does not mean the bottles are missing — they are
    # appended by the GitHub workflow, to a release that may well have been
    # created successfully before some later host failed. #76 again.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_4
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_4.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Wait for every bottle manifest on the Forgejo release
        run: |
          set -euo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/dreame-valetudo
          # Four platforms. A stable tag bottles BOTH formulae — the stable one
          # and the rc one it re-points at itself — because a bottle's filename
          # embeds the formula name and its keg is rooted at
          # `<formula>/<version>/`, so one cannot be renamed into the other.
          # Without the second set, `brew install dreame-valetudo-rc` after a
          # stable release silently goes back to building from source.
          case "$GITHUB_REF_NAME" in
            *-rc.*) expected=4 ;;
            *)      expected=8 ;;
          esac
          echo "waiting for $expected bottle manifest(s) and the archives they name"
          # The readiness condition is NOT "the manifests arrived". They are
          # uploaded in the same pass as the archives and their double-dash names
          # sort first, so the manifests are normally there while tarballs are
          # still in flight — a one-shot check would fail on a perfectly healthy
          # release. And names alone are not enough either: a re-run replaces an
          # archive in place, so a same-named file from the previous attempt can
          # be sitting there while the manifest already describes the new one.
          #
          # So the loop waits until every manifest is present AND every archive it
          # names hashes to the sha256 recorded for it. That is exactly the claim
          # the published formula makes, checked before making it — a formula
          # whose sha256 does not match the served file fails every install, and
          # unlike a missing block it does not fall back to building from source.
          #
          # Up to 60 minutes: the macOS legs build the formula from source, twice
          # on a stable tag, on the slowest runners in the fleet.
          ready=""
          for _ in $(seq 1 180); do
            assets=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" \
              | jq -r '.assets[]? | "\(.name)\t\(.browser_download_url)"' || true)
            urls=$(printf '%s\n' "$assets" | awk -F'\t' '$1 ~ /\.bottle\.json$/ {print $2}')
            if [ "$(printf '%s\n' "$urls" | grep -c . || true)" -lt "$expected" ]; then
              sleep 20; continue
            fi
            rm -rf manifests && mkdir -p manifests
            printf '%s\n' "$urls" | while read -r u; do
              [ -n "$u" ] && curl -sSL -o "manifests/$(basename "$u")" "$u"
            done
            ok=true
            while read -r name want; do
              [ -n "$name" ] || continue
              url=$(printf '%s\n' "$assets" | awk -F'\t' -v n="$name" '$1 == n {print $2}')
              if [ -z "$url" ]; then ok=false; break; fi
              # A failed download is a REASON TO WAIT, not a reason to abort. Under `set -e` the
              # pipeline's nonzero status killed the step outright, so one transient Forgejo error
              # ended the advertised sixty-minute wait on its first iteration.
              if ! got=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1); then ok=false; break; fi
              if [ "$got" != "$want" ]; then ok=false; break; fi
            done < <(jq -r '.[].bottle.tags[] | "\(.filename)\t\(.sha256)"' manifests/*.json)
            if [ "$ok" = true ]; then ready=1; break; fi
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "::error::the bottles never arrived intact after 60m — the tap keeps its unbottled formula"
            exit 1
          fi
          ls -l manifests/
          echo "every bottle the manifests name is present and matches its sha256"
      - name: Re-render the formula with the bottle block and push
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          # Outside the checkout, for the same reason the first pass does it:
          # update-tap.sh builds an sdist to compare against PyPI, and anything
          # sitting beside the source is swept into it.
          tap="$(mktemp -d)/tap"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" "$tap"
          # update-tap.sh builds the sdist locally to derive the checksum, so the build
          # frontend has to be here. The PyPI job installs it too, but jobs do not share
          # an environment — and the failure is `No module named build`, mid-release.
          python -m pip install --upgrade pip build
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" "$tap" "$PWD/manifests"
          cd "$tap"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "dreame-valetudo ${GITHUB_REF_NAME#v} bottles" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push
  nas-bridge:
    name: Bridge the GitHub-built assets → NAS
    needs: [guard, releases]
    # Runs even when `releases` went red. It needs exactly one thing — the GitHub-built assets on
    # the public Forgejo release — and that has nothing to do with whether the other registries
    # accepted their copies.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the GitHub-built assets on the public Forgejo release, then copy to NAS
        run: |
          # -e stays ON. Only the FETCH is allowed to fail softly, and an `|| partial=true` OR-list
          # is exempt from -e anyway — dropping -e for it would also stop the NAS upload itself
          # from failing the job, reporting a green bridge over a failed copy.
          set -euo pipefail
          chmod +x packaging/fetch-release-assets.sh packaging/forgejo-release.sh
          # Everything GitHub builds lands on the GitHub + public-Forgejo releases and stops there,
          # because the NAS is internal and no GitHub runner can reach it. That is two workflows'
          # worth: the notarized .pkg (release-macos.yml) and the whole arm64 Linux set
          # (release-linux-arm64.yml, which builds natively rather than emulating).
          #   2 .pkg (arm64 + x86_64) + arm64 .deb + aarch64 .rpm + the arm64 standalone tarball
          #
          # Named by suffix rather than by a substring like `arm64`, which would also match the
          # Homebrew bottles bottles.yml appends to this same release. Those are kept off the NAS
          # on purpose — reconcile excludes them too, because a bottle is not reproducible.
          select='.assets[]? | select(
                    (.name | endswith(".pkg"))
                    or (.name | endswith("_arm64.deb"))
                    or (.name | endswith(".aarch64.rpm"))
                    or (.name | endswith("-linux-arm64.tar.gz"))
                  ) | .browser_download_url'
          # Upload what DID arrive before going red: a half-copied NAS beats an empty one, and
          # prune-rcs reads this job's verdict before deleting candidates either way.
          partial=false
          packaging/fetch-release-assets.sh "$GITHUB_REF_NAME" 5 "$select" > fetched.txt \
            || partial=true
          mapfile -t fetched < fetched.txt
          [ "${#fetched[@]}" -gt 0 ] || { echo "::error::nothing arrived to bridge to the NAS"; exit 1; }
          bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${fetched[@]}"
          if [ "$partial" = true ]; then
            echo "::error::the NAS release is incomplete for $GITHUB_REF_NAME"
            exit 1
          fi

  reconcile:
    name: Reconcile releases across registries (bridge .pkgs to NAS, heal history)
    needs: [guard, releases, nas-bridge]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags needed for the reconcile loop
      - name: Require the current release's GitHub-built .pkgs, then reconcile every tag
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/dreame-valetudo
          # Both native GitHub build legs install and exercise their signed package before the
          # publish job can place it here. Their presence is therefore the cross-forge qualification
          # gate, not merely an asset-availability convenience.
          fail=0
          qualified=false
          for _ in $(seq 1 180); do
            qualified=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" | jq -r '
              [.assets[]?.name] as $names |
              # By SUFFIX, not exact name: .pkg filenames carry the version now, and this gate must
              # not have to know how the version is spelled to recognise the arch it qualifies.
              ($names | any(endswith("-macos-arm64.pkg"))) and
              ($names | any(endswith("-macos-x86_64.pkg")))
            ' 2>/dev/null || echo false)
            [ "$qualified" = true ] && break
            sleep 10
          done
          [ "$qualified" = true ] || {
            echo "::error::current tag's two GitHub-qualified .pkgs were not published within 30m"
            fail=1
          }
          chmod +x packaging/reconcile-releases.sh packaging/forgejo-release.sh packaging/github-release.sh
          bash packaging/reconcile-releases.sh || fail=1
          exit "$fail"

  prune-rcs:
    name: Prune the rc releases/tags a shipped stable supersedes (stable tags only)
    # STABLE tags only: an rc tag (hyphenated) never prunes. Runs AFTER homebrew-tap has re-pointed
    # the rc formula at the stable AND after reconcile has confirmed the stable is fanned out to all
    # three registries — the default needs-success gate means a failed reconcile (stable not fully
    # published) skips the prune, so the rc formula is never left pointing at a deleted rc.
    needs: [releases, registry, nas-bridge, homebrew-tap, homebrew-bottles, reconcile]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sweep every rc a fully fanned-out stable now supersedes
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          # Forgejo scopes the package registry separately: the repo PATs above cannot read or
          # delete a package, so the registry half of the sweep needs its own write:package token.
          PACKAGE_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          # Fail closed: the script is a dry run unless DRY_RUN is exactly "false".
          DRY_RUN: "false"
        run: |
          # Warn-only. The stable is already published by this point, so a prune problem must never
          # redden the release or make a valid stable look failed.
          bash packaging/prune-rcs.sh \
