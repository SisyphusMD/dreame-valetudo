name: DustBuilder forms

# The rooting flow never depends on this network check. It runs weekly, on demand, and whenever
# its parser/goldens change; only an all-model pass advances the date shown by the installed tool.
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .forgejo/workflows/dustbuilder-forms.yml
      - src/dreame_valetudo/dustbuilder.py
      - src/dreame_valetudo/cli.py
      - src/dreame_valetudo/phases/image.py
      - src/dreame_valetudo/phases/recon.py
      - src/dreame_valetudo/models.py
      - libexec/dustbuilder-forms/**
      - libexec/verify_valetudo_contract.py
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/dustbuilder-forms.yml
      - src/dreame_valetudo/dustbuilder.py
      - src/dreame_valetudo/cli.py
      - src/dreame_valetudo/phases/image.py
      - src/dreame_valetudo/phases/recon.py
      - src/dreame_valetudo/models.py
      - libexec/dustbuilder-forms/**
      - libexec/verify_valetudo_contract.py
      - pyproject.toml

concurrency:
  group: dustbuilder-forms
  cancel-in-progress: false

jobs:
  verify:
    # Never execute fork-supplied Python on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Retried in-step, the shape publish.yml and tap-bottles.yml already use: a transient
        # versions-manifest fetch failure has taken every job of a run down together before now, and
        # Forgejo exposes no rerun endpoint, so recovery has to happen inside the job. The guard is
        # `!= 'success'`, not `== 'failure'`: if a runner ever leaves `outcome` unset, an equality
        # test would silently skip the retry AND `continue-on-error` would have swallowed the first
        # failure, letting later steps run against whatever interpreter happened to be present.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14.7"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14.7"
      # Installed, not merely checked out: the package lives under src/, so `python -m
      # dreame_valetudo` finds nothing when run from the repo root. The release and prerelease
      # gates already install it before their own version checks, for the same reason.
      - name: Install the package so its module is importable
        run: python -m pip install --quiet -e .
      - name: compare every live form with its per-model golden
        run: python -m dreame_valetudo verify-forms
      - name: compare model and rooting contracts with official Valetudo
        run: |
          git clone --depth=1 https://github.com/Hypfer/Valetudo.git /tmp/upstream-valetudo
          python -m libexec.verify_valetudo_contract /tmp/upstream-valetudo
      - name: record the last successful live verification
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          verified_on=$(date -u +%Y.%m.%d)
          stamp=libexec/dustbuilder-forms/verified-on.txt
          if [ "$(cat "$stamp")" = "$verified_on" ]; then
            exit 0
          fi
          printf '%s\n' "$verified_on" > "$stamp"
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"
          git add libexec/dustbuilder-forms/verified-on.txt
          git commit -m "chore(dustbuilder): record verified forms on $verified_on"
          auth_b64=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=Authorization: Basic ${auth_b64}" push origin HEAD:main
