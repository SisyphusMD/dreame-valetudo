name: Release (Linux arm64)

# arm64 Linux artifacts, built NATIVELY on our arm64 runner. Architecture picks the runner label:
# amd64 on the cluster, arm64 here, macOS on the Mac VMs, and nothing anywhere is emulated.
#
# What emulation cost, for the record: buildkit runs an emulated guest binary through an injected
# emulator, so a onefile app's parent process is /dev/.buildkit_qemu_emulator rather than the app.
# PyInstaller 6.22.1 added a parent-executable check, and every emulated arm64 self-test and
# package smoke started failing — it cost this project's rc.13 Linux assets and the sibling's
# rc.18. This project answered by freezing onedir, which spawns no child; that stays, but the
# constraint behind it is gone.
#
# APPENDS to the release publish.yml already created, exactly as release-macos.yml does. It does
# not rely on creating one: publish.yml publishes amd64 immediately, and these arrive after. A failure here leaves a
# release missing its arm64 assets — which reconcile repairs and prune-rcs refuses to prune
# around — rather than blocking the release outright.

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build arm64 artifacts for, e.g. v0.3.0-rc.18"
        required: true
        type: string

# Keyed per tag, so a dispatched rebuild of one tag never displaces another tag's publish.
concurrency:
  group: release-arm64-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + publish arm64 ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-26.04-arm
    env:
      # The tag reaches every `run:` below as an ENVIRONMENT VALUE, never as `${{ }}` inside the
      # script. Actions substitutes an expression into the script TEXT before any shell parses it,
      # so a tag is not data there — it is source. Git allows quotes, semicolons and backticks in a
      # ref name, and `v1.2.3";id;"` matches this workflow's own `v*.*.*` trigger, so the tag that
      # runs here can be chosen by whoever can push one. That script would execute with the package
      # signing key in scope. As `$TAG` it is a string, and the quoting is the shell's problem.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # `refs/tags/` is not decoration. This job runs with the signing key in scope, and the
      # dispatch input is a free-text ref — a branch name would check out that branch's copy of
      # build-linux-arch.sh and run it with the key in the environment. Resolving only under
      # refs/tags/ means a dispatch can rebuild an existing tag and nothing else: no such ref
      # exists for a branch, so the checkout fails instead of executing it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # The same tag grammar every other release step enforces, before anything reads the key. A
      # tag can be named freely even though it cannot be a branch, and this job should build only
      # things that are actually releases.
      - name: Validate the tag before the signing key comes into scope
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . packaging/release-common.sh
          rel_validate_tag "$TAG"

      # build-linux-arch.sh exports the bundles with `--output type=local`, which the default
      # docker driver does not support — only the docker-container one this installs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]

      - name: Build the arm64 bundles, package them, and prove the packages carry them
        env:
          # Step-local: the key is needed by exactly this step.
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          # The manylinux builder's dnf installs, through the NAS artifact cache.
          DNF_MIRROR: https://artifacts.lan.bryantserver.com
        run: |
          set -euo pipefail
          # The same pins the amd64 half uses, from the same file, sourced by the script itself.
          bash packaging/build-linux-arch.sh arm64 "$TAG"

      - name: Append the arm64 assets to the three releases
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          chmod +x packaging/github-release.sh packaging/forgejo-release.sh packaging/changelog-section.sh
          bash packaging/changelog-section.sh "${TAG#v}" > notes.md
          # BEFORE anything that can create the release. This workflow is triggered by the tag
          # independently of publish.yml, and the release helpers create the release when it is
          # missing — so publishing here first would advertise a version whose PyPI library is not
          # yet installable.
          bash packaging/wait-for-pypi.sh "${TAG#v}"
          PKGVER="${TAG#v}"; PKGVER="${PKGVER/-rc./~rc.}"
          ASSETS=(
            "dreame-valetudo_${PKGVER}_arm64.deb"
            "dreame-valetudo-${PKGVER}.aarch64.rpm"
            "dreame-valetudo-${PKGVER}-linux-arm64.tar.gz"
          )
          # Named, not globbed, and existence-checked: a missing artifact must fail here rather
          # than publish a short set that looks like a healthy release.
          for a in "${ASSETS[@]}"; do
            [ -s "$a" ] || { echo "::error::expected arm64 artifact missing: $a" >&2; exit 1; }
          done
          # One file PER ARCHITECTURE, named for `uname -m` so `sha256sum -c --ignore-missing
          # SHA256SUMS-$(uname -m)` needs no editing anywhere. Each is written by the machine that
          # BUILT those bytes — a checksum written by a host that did not build the artifact is
          # worth less — and published assets are immutable, so a single combined file could not be
          # appended to when the arm64 job lands later.
          #
          # This is integrity, not authenticity: served from the same host as the artifacts, it
          # answers "did this arrive intact", which is the gap `dpkg -i` leaves open by checking
          # nothing. The GPG signature on the packages is what proves origin, and apt/dnf verify it
          # automatically from the repository channel. The two are complementary.
          #
          # Both spellings: GitHub's asset API rewrites `~` to `.` in the uploaded FILENAME while
          # Forgejo serves the canonical one, so an artifact whose name contains `~` is listed twice
          # with the same hash and --ignore-missing skips the spelling you did not download.
          sums="SHA256SUMS-aarch64"
          sha256sum "${ASSETS[@]}" | sed 's| \./| |' > "$sums"
          awk '$2 ~ /~/ { name = $2; gsub(/~/, ".", name); print $1 "  " name }' "$sums" >> "$sums.alt"
          [ -s "$sums.alt" ] && cat "$sums.alt" >> "$sums"
          rm -f "$sums.alt"
          ASSETS+=("$sums")
          echo "checksums:"; cat "$sums"
          # All three registries get the same bytes, the NAS directly now that the build runs where
          # it can reach it. Attempted independently so one failing does not hide the others'
          # result, the shape publish.yml uses for the same reason.
          failed=""
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "$CLUSTER_TOKEN" "$TAG" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.bryantserver.com"
          packaging/github-release.sh "$GH_TOKEN" \
            "$TAG" notes.md "${ASSETS[@]}" || failed="$failed github.com"
          packaging/forgejo-release.sh forgejo.lan.bryantserver.com \
            "$NAS_TOKEN" "$TAG" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.lan.bryantserver.com"
          if [ -n "$failed" ]; then
            echo "::error::arm64 asset publishing failed for:$failed"
            exit 1
          fi
