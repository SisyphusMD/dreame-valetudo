name: Dustfab forms

# The rooting flow never depends on this network check. It runs weekly, on demand, and whenever
# its parser, goldens or the guidance printed from them change. It only reports: the "last
# verified" date shipped in the tool is written by the release and prerelease workflows, which run
# the same check, because a bot commit to main is refused by branch protection.
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .forgejo/workflows/dustfab-forms.yml
      - src/dreame_valetudo/dustfab.py
      - src/dreame_valetudo/models.py
      - src/dreame_valetudo/phases/image.py
      - libexec/dustfab-forms/**
      - libexec/verify_valetudo_contract.py
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/dustfab-forms.yml
      - src/dreame_valetudo/dustfab.py
      - src/dreame_valetudo/models.py
      - src/dreame_valetudo/phases/image.py
      - libexec/dustfab-forms/**
      - libexec/verify_valetudo_contract.py

# One run at a time: Dustfab rate-limits and bans by address, so overlapping runs only add risk.
concurrency:
  group: dustfab-forms
  cancel-in-progress: false

jobs:
  verify:
    # Never execute fork-supplied Python on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Retried in-step, the shape publish.yml and tap-bottles.yml already use: a transient
        # versions-manifest fetch failure has taken every job of a run down together before now, and
        # Forgejo exposes no rerun endpoint, so recovery has to happen inside the job. The guard is
        # `!= 'success'`, not `== 'failure'`: if a runner ever leaves `outcome` unset, an equality
        # test would silently skip the retry AND `continue-on-error` would have swallowed the first
        # failure, letting later steps run against whatever interpreter happened to be present.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14.8"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14.8"
      # Installed, not merely checked out: the package lives under src/, so `python -m
      # dreame_valetudo` finds nothing when run from the repo root. The release and prerelease
      # gates already install it before their own version checks, for the same reason.
      - name: Install the package so its module is importable
        run: python -m pip install --quiet -e .
      - name: compare every live Dustfab page with its golden
        run: python -m dreame_valetudo verify-forms
      - name: compare model and rooting contracts with official Valetudo
        run: |
          git clone --depth=1 https://github.com/Hypfer/Valetudo.git /tmp/upstream-valetudo
          python -m libexec.verify_valetudo_contract /tmp/upstream-valetudo
