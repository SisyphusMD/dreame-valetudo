name: Dustfab forms

# The rooting flow never depends on this network check. It runs weekly, on demand, and whenever
# its parser, goldens or the guidance printed from them change. It only reports: the "last
# verified" date shipped in the tool is written by the release and prerelease workflows, which run
# the same check, because a bot commit to main is refused by branch protection.
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .forgejo/workflows/dustfab-forms.yml
      - src/dreame_valetudo/dustfab.py
      - src/dreame_valetudo/models.py
      - src/dreame_valetudo/phases/image.py
      - libexec/dustfab-forms/**
      - libexec/verify_valetudo_contract.py
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/dustfab-forms.yml
      - src/dreame_valetudo/dustfab.py
      - src/dreame_valetudo/models.py
      - src/dreame_valetudo/phases/image.py
      - libexec/dustfab-forms/**
      - libexec/verify_valetudo_contract.py

# One run at a time: Dustfab rate-limits and bans by address, so overlapping runs only add risk.
concurrency:
  group: dustfab-forms
  cancel-in-progress: false

jobs:
  verify:
    # Never execute fork-supplied Python on the self-hosted runner.
    # flow == 0 also turns away AGit PRs (pushed to refs/for/<branch>): they report this repo as
    # their head, and a maintainer reopening one would run the pushed code on our runner.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.flow == 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Retried in-step, the shape publish.yml and tap-bottles.yml already use: a transient
        # versions-manifest fetch failure has taken every job of a run down together before now, and
        # Forgejo exposes no rerun endpoint, so recovery has to happen inside the job. The guard is
        # `!= 'success'`, not `== 'failure'`: if a runner ever leaves `outcome` unset, an equality
        # test would silently skip the retry AND `continue-on-error` would have swallowed the first
        # failure, letting later steps run against whatever interpreter happened to be present.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.15.2"
      # Installed, not merely checked out: the package lives under src/, so `python -m
      # dreame_valetudo` finds nothing when run from the repo root. The release and prerelease
      # gates already install it before their own version checks, for the same reason.
      - name: Install the package so its module is importable
        run: python -m pip install --quiet -e .
      # Dustfab being offline is reported, not failed: it says nothing about its pages, and failing
      # on it turns every pull request that touches this workflow red for as long as the site is
      # down. A page or stage1 package that changed still fails.
      - name: compare every live Dustfab page with its golden
        run: |
          set +e
          python -m dreame_valetudo verify-forms
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            3) echo "::warning::Dustfab could not be reached, so its pages were not all checked" ;;
            *) exit "$rc" ;;
          esac
      - name: compare model and rooting contracts with official Valetudo
        # The default branch on purpose: this check exists to notice upstream drift. Only the paths
        # the verifier reads, so a slow link costs little; bounded and retried, so one network blip
        # does not turn the run red, but still failed after the last try, since a contract check
        # that quietly skips is worse than a red run.
        run: |
          set -euo pipefail
          dest=/tmp/upstream-valetudo
          for attempt in 1 2 3; do
            rm -rf "$dest"
            if timeout 300 git clone --quiet --depth=1 --filter=blob:none --sparse \
                https://github.com/Hypfer/Valetudo.git "$dest" \
              && timeout 300 git -C "$dest" sparse-checkout set backend/lib/robots/dreame docs/pages; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not fetch Hypfer/Valetudo after 3 tries" >&2
              exit 1
            fi
            sleep $(( attempt * 30 ))
          done
          python -m libexec.verify_valetudo_contract /tmp/upstream-valetudo
