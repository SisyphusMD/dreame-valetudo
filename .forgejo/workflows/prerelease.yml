name: Prerelease

# On-demand dev/test build, same idea as Release but without cutting a real version. Dispatch from
# any branch and pick the target bump; this stamps an `-rc.N` version onto a TAG only — the branch,
# CHANGELOG, and README are never touched. The tag triggers publish.yml + release-macos.yml, which
# build the real .deb/.pkg/tarball and publish them as a GitHub + Forgejo *prerelease* (never
# "latest"; the Homebrew tap stays on the last stable). Use it to validate the shipping artifacts on
# hardware, then cut the matching stable release the normal way.
#
# Split in two like release.yml: `gate` decides what the rc IS and proves the tree is green while
# holding no credential; `tag` is the only job handed the write token, and it re-derives the same
# stamp from a fresh checkout and refuses to push unless the bytes hash to what the gate qualified.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Target version this rc is a candidate for"
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  # Stable and RC tag creation share one producer slot. Tag publishing has a per-tag group of its
  # own: sharing this group could displace a queued publish run before it ever builds its assets.
  group: release-cut
  cancel-in-progress: false

jobs:
  gate:
    name: Qualify prerelease intent (secret-free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      intent_sha256: ${{ steps.intent.outputs.sha256 }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shellcheck every shipped and integration script
        run: bash packaging/shellcheck-all.sh

      - name: Compute the next -rc version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP" --rc)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Prerelease ${version} (candidate for ${version%-rc.*}, from ${GITHUB_REF_NAME})"

      - name: Refuse if the tag already exists
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || { echo "::error::Tag ${TAG} exists"; exit 1; }

      - name: Enforce the pre-0.4 release boundary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 packaging/check-release-boundary.py "$VERSION"

      - name: Stamp the version (pyproject + package + uv.lock)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 packaging/stamp-version.py "$VERSION"
          python3 packaging/stamp-version.py "$VERSION" --check

        # Retried in-step, the shape publish.yml and tap-bottles.yml already use: a transient
        # versions-manifest fetch failure has taken every job of a run down together before now, and
        # Forgejo exposes no rerun endpoint, so recovery has to happen inside the job. The guard is
        # `!= 'success'`, not `== 'failure'`: if a runner ever leaves `outcome` unset, an equality
        # test would silently skip the retry AND `continue-on-error` would have swallowed the first
        # failure, letting later steps run against whatever interpreter happened to be present.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14.7"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14.7"

      - name: Snapshot the exact intended prerelease diff
        id: intent
        run: |
          set -euo pipefail
          # The rc stamp is exactly these three files and nothing else. Hashing the patch here,
          # before any third-party tool is installed, is what the tag job reproduces byte-for-byte.
          printf '%s\n' src/dreame_valetudo/__init__.py pyproject.toml uv.lock \
            | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/intended-release.patch"
          sha256sum "$RUNNER_TEMP/intended-release.patch" \
            | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Test gate (lint + typecheck + unit + integration)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # renovate: datasource=pypi depName=ruff
          RUFF="0.16.5"
          # renovate: datasource=pypi depName=mypy
          MYPY="2.3.1"
          # renovate: datasource=pypi depName=pytest
          PYTEST="9.1.1"
          # renovate: datasource=pypi depName=pytest-cov
          PYTEST_COV="7.1.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          # renovate: datasource=pypi depName=pyyaml
          PYYAML="6.0.3"
          python -m pip install --upgrade pip
          pip install "ruff==$RUFF" "mypy==$MYPY" "pytest==$PYTEST" "pytest-cov==$PYTEST_COV" "pyyaml==$PYYAML" -e .
          ruff check src/dreame_valetudo libexec tests/python packaging/stamp-version.py
          mypy
          # Gated HERE too, not only in CI: ci.yml runs on a branch, and a release is cut from a
          # tag. Without this the release path was the one way a coverage regression could ship.
          pytest -q tests/python --cov --cov-report=term-missing --cov-fail-under=99
          # The Runner seam every external command funnels through, held at 100 separately so a
          # regression there cannot hide inside the repository average.
          coverage report --include='*/run.py' --fail-under=100
          python -c "import re,sys; v=re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1); sys.exit(0 if v=='${VERSION}' else 1)"
          python -m dreame_valetudo version | grep -q "dreame-valetudo ${VERSION}"
          python -m dreame_valetudo help | grep -q "Supported models"
          # `build`, so release-scripts.sh exercises the tap section instead of skipping it.
          # CONVENTIONS 6c: a gate that only really runs in ci.yml does not constrain a release.
          python3 -m pip install --upgrade build
          for t in tests/release/*.sh; do bash "$t"; done

      - name: Prove the test toolchain changed no prerelease byte
        run: |
          set -euo pipefail
          git diff --binary | cmp - "$RUNNER_TEMP/intended-release.patch"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

  mirror-gate:
    name: Qualify the mirror's macOS checks on the source commit (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the mirror's macOS CI to be green on the source commit
        # This forge has no macOS runner, so nothing here can run the suite on a Mac. ci.yml waits
        # for the mirror's verdict per pull request, which leaves main reachable by anything that
        # did not go through one — a direct push, an infra failure someone retried, a run that went
        # red after merge. Cutting from main is exactly when that matters.
        #
        # The SOURCE commit, not the tagged one: the tag job stamps version strings and commits, so
        # the tagged tree is a child of this SHA and no branch workflow ever evaluates it.
        env:
          # Optional and read-only. Unauthenticated GitHub allows 60 requests an hour PER IP,
          # shared with everything else egressing from this network. A token needs NO scopes for a
          # public repo and lifts the limit to 5,000/hour. Absent, this still works, just slowly.
          # The job holds no WRITE credential either way, which is the property that matters.
          MIRROR_CI_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}
        # Both, not just one: the formula check proves the macOS install and the CI matrix
        # proves the library's own tests run on a Mac, and gating on either alone lets a release
        # be cut from a commit the other found red. Named by file: a display name is prose, and a
        # reworded one would match no runs and read as "not delivered yet".
        run: |
          bash packaging/check-mirror-ci.sh "${{ github.sha }}" .github/workflows/formula-macos.yml
          bash packaging/check-mirror-ci.sh "${{ github.sha }}" .github/workflows/ci-macos.yml

  tag:
    name: Authorize and push prerelease tag
    needs: [gate, mirror-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified prerelease intent
        env:
          BUMP: ${{ inputs.bump }}
          QUALIFIED_VERSION: ${{ needs.gate.outputs.version }}
          QUALIFIED_TAG: ${{ needs.gate.outputs.tag }}
          QUALIFIED_INTENT_SHA256: ${{ needs.gate.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          # Same derivation as the gate, on a tree no gate step ever touched. Nothing here trusts
          # the gate beyond the version and the hash it has to match.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP" --rc)
          [ "$version" = "$QUALIFIED_VERSION" ] && [ "$tag" = "$QUALIFIED_TAG" ] \
            || { echo "::error::qualified prerelease intent changed between runners"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          python3 packaging/check-release-boundary.py "$version"
          python3 packaging/stamp-version.py "$version"
          python3 packaging/stamp-version.py "$version" --check
          printf '%s\n' src/dreame_valetudo/__init__.py pyproject.toml uv.lock \
            | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          ACTUAL_INTENT_SHA256=$(git diff --binary | sha256sum | awk '{print $1}')
          [ "$ACTUAL_INTENT_SHA256" = "$QUALIFIED_INTENT_SHA256" ] \
            || { echo "::error::prerelease bytes differ from the qualified intent"; exit 1; }

      - name: Commit and tag the reproduced prerelease
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          # The version stamp rides on the TAGGED commit only; the branch is never pushed, so main
          # (or a feature branch) never carries an -rc marker. publish.yml/release-macos.yml check
          # out the tag, so the built artifacts still report the rc version.
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add pyproject.toml src/dreame_valetudo/__init__.py uv.lock
          git commit -m "prerelease: ${VERSION}"
          python3 packaging/stamp-version.py "$VERSION" --check
          git tag -a -m "prerelease: ${VERSION}" "$TAG"

      - name: Push the prerelease tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          GH_READ: ${{ secrets.GH_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          # Asserted here, before anything is pushed: the mirror confirmation two steps down
          # refuses to probe GitHub unauthenticated, and discovering that after the push would
          # leave the tag published and the run failed.
          : "${GH_READ:?a read-only GitHub token is required to confirm the mirror}"
          # Kept inline rather than calling packaging/push-tag.sh: unlike release.yml's tag job
          # (hard-refuses non-main dispatches), this workflow is dispatchable from any branch, so
          # checkout would hand this job that branch's own copy of a script — and this step is the
          # one place the repo-write PAT reaches shell. It stays text this repo's own workflow
          # defines at the ref actually running, not something read back off the checkout and handed
          # a credential.
          #
          # An annotated tag object carries the rc message and dates; a lightweight ref would let a
          # later force-push retarget the version silently.
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]
          [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]
          test -z "$(git status --porcelain)"
          #
          # An EXPLICIT destination rather than `origin`: the steps above ran the dispatched
          # branch's next-version.sh and stamp-version.py, so `origin` is a value branch-supplied
          # code had the opportunity to repoint, and pushing to it would hand a repo-write PAT to
          # whatever host it now names. These two variables come from the runner, not the checkout.
          AUTH_B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=Authorization: Basic ${AUTH_B64}" \
            push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$TAG"

      - name: Force the push-mirrors to propagate the tag now (GitHub + NAS)
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          GH_READ: ${{ secrets.GH_REPO_READ_PAT }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          # Best-effort: sync-on-commit propagates tag pushes immediately in practice, and this
          # endpoint needs more than the PAT's write:repository scope (403 otherwise). Warn-only so
          # a scope refusal never fails a release whose tag already fanned out.
          curl -fsS --max-time 30 -X POST -H "Authorization: token ${TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/push_mirrors-sync" >/dev/null 2>&1 \
            || echo "::warning::push_mirrors-sync refused (PAT scope); relying on sync_on_commit"
          # The sync request is unverifiable on its own, so read the mirror back. Unauthenticated and
          # against a slug the runner supplies, which keeps this out of reach of the checkout the
          # surrounding step is careful not to trust. Only the GET is repeated: a POST that timed out
          # may still have applied, and repeating it would re-trigger a sync already in flight.
          ref_json="${RUNNER_TEMP:-/tmp}/mirror-ref.json"
          want=$(git rev-parse "refs/tags/${TAG}")
          mirror_has_tag() {
            # Always authenticated: unauthenticated github.com allows 60 requests an hour per IP,
            # which every runner and mirror probe shares, so the unauthenticated path answered 403
            # rather than answering. The token is validated in the push step, before any mutation.
            code=$(curl -sS -o "$ref_json" -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer ${GH_READ}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null) || return 2
            case "$code" in
              200) : ;;
              404) return 1 ;;
              *)   return 2 ;;   # rate limited or unreachable: unknown, NOT success
            esac
            got=$(jq -r '.object.sha // empty' "$ref_json")
            [ -n "$got" ] || return 2
            # Existence is not propagation. An rc number is derived from the source tags alone, so a
            # same-named tag left behind by a partial prune would answer 200 while still pointing at the
            # previous object - and the jobs waiting on the mirror would run against the wrong commit.
            [ "$got" = "$want" ]
          }
          for attempt in 1 2 3; do
            sleep $(( attempt * 20 ))
            # Captured before any other command runs: `$?` read after an `if` is the status of the IF,
            # not of the probe, so the unknown branch would never fire.
            mirror_has_tag && status=0 || status=$?
            if [ "$status" = 0 ]; then
              echo "tag ${TAG} confirmed on the mirror"
              break
            fi
            if [ "$status" = 2 ]; then
              echo "::warning::could not determine whether ${TAG} reached the mirror (check unavailable)"
              break
            fi
            echo "::warning::${TAG} not on the mirror yet (attempt ${attempt}/3)"
            [ "$attempt" = 3 ] && echo "::warning::${TAG} never reached the mirror. The tag is on the source \
          of truth, but any job waiting for it there will time out; re-run push_mirrors-sync with an \
          admin-scoped token, or wait for the mirror interval"
          done
