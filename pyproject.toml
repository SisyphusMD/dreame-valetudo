# dreame-valetudo — Python CLI to root Dreame robot vacuums and install Valetudo.
[project]
name = "dreame-valetudo"
version = "0.2.1"
description = "Guided, idempotent tool to root supported Dreame robot vacuums and install Valetudo"
# Rendered as the PyPI project page. Without it the page is blank, which for a tool that rewrites
# a robot's firmware is the last place to leave someone without context.
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The package itself imports no third-party runtime deps: pyusb is needed only by the fastboot
# libusb client, which runs as a subprocess (via `uv run --with pyusb`, a pyusb-capable python, or
# the frozen dreame-fastboot binary). PYUSB_VERSION is pinned in constants.py (Renovate-tracked).
dependencies = []

# Source points at Forgejo because that is where the code actually lives and where releases are
# cut; GitHub is a push-mirror. Homepage, docs and issues point at GitHub because that is where
# users are. Same split as whiskerless.
[project.urls]
Homepage = "https://github.com/SisyphusMD/dreame-valetudo"
Documentation = "https://github.com/SisyphusMD/dreame-valetudo/tree/main/docs"
Source = "https://forgejo.bryantserver.com/SisyphusMD/dreame-valetudo"
Issues = "https://github.com/SisyphusMD/dreame-valetudo/issues"

[project.scripts]
dreame-valetudo = "dreame_valetudo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreame_valetudo"]

# Ship the fastboot libusb client + per-model form goldens inside the package, so an installed wheel /
# PyInstaller bundle resolves them via resolve_libexec.
[tool.hatch.build.targets.wheel.force-include]
"libexec/fastboot-libusb.py" = "dreame_valetudo/libexec/fastboot-libusb.py"
"libexec/dustbuilder-forms" = "dreame_valetudo/libexec/dustbuilder-forms"
# Ship the changelog inside the package so the installed tool can show "what's new" on upgrade.
"CHANGELOG.md" = "dreame_valetudo/CHANGELOG.md"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # Kept identical to the sibling on purpose: a rule enabled in one project and not the other
    # makes a `# noqa` that is correct here an RUF100 error there — which is exactly why the shared
    # packaging/check-glibc-floor.py refuses to carry one and asks each consumer to exempt it.
    "E4", "E7", "E9", "F",   # pyflakes + the default pycodestyle subset
    "I",                     # import sorting
    "ASYNC", "B", "BLE", "C4", "FLY", "ISC", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "UP",
    "PLC", "PLE", "PLW",     # pylint conventions/errors/warnings (not the noisy PLR refactor set)
]

[tool.ruff.lint.per-file-ignores]
# Vendored from project-standard. Shared files carry no project-specific noqa codes (a code the
# sibling does not enable would fail RUF100 there), so the exemption lives with the rule set that
# needs it. The lazy PyInstaller import is deliberate: it is a release-build dependency only.
"packaging/check-glibc-floor.py" = ["PLC0415"]
# False positive: ruff can't see that console.die is NoReturn across the module boundary.
"src/dreame_valetudo/fastboot.py" = ["RET503"]
"src/dreame_valetudo/phases/manage.py" = ["RET503"]

[tool.coverage.run]
source = ["src/dreame_valetudo", "libexec"]
branch = true

[tool.coverage.report]
# Without this, --cov-fail-under compares the total rounded to whole percent, so 94.6% passes a
# 95% floor. Ported from whiskerless, which has had coverage since before this project had any.
precision = 2
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/dreame_valetudo", "libexec/fastboot-libusb.py"]

# pyusb ships no type stubs; the fastboot client is the only thing that imports it.
[[tool.mypy.overrides]]
module = ["usb.*"]
ignore_missing_imports = true

[dependency-groups]
# Exact, not floors. CI installs these literally and `uv run` resolves them from uv.lock, so any
# disagreement means contributors lint with a different binary than the gate. A floor is
# permanently satisfied, which leaves pep621 nothing to raise and no way for the lockfile to move
# in the same PR as the annotated workflow literals.
# pyyaml is a TEST-only parser for the workflow files, not a runtime dep — the package itself
# still imports nothing outside the stdlib.
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "pyyaml==6.0.3", "ruff==0.16.5", "mypy==2.3.1"]
