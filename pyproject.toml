# dreame-valetudo — Python CLI to root Dreame robot vacuums and install Valetudo.
[project]
name = "dreame-valetudo"
version = "0.2.1"
description = "Guided, idempotent tool to root supported Dreame robot vacuums and install Valetudo"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The package itself imports no third-party runtime deps: pyusb and pyserial are needed only by the
# subprocess helpers (the fastboot libusb client and the UART console), which run via
# `uv run --with`, a capable python, or the frozen dreame-fastboot / dreame-uart binaries.
# PYUSB_VERSION and PYSERIAL_VERSION are pinned in constants.py (Renovate-tracked).
dependencies = []

[project.optional-dependencies]
# Source and tool installs opt into the subprocess-only UART helper dependency. The package itself
# still imports nothing third-party, while a package manager can provision the exact helper stack.
uart = ["pyserial==3.5"]

[project.scripts]
dreame-valetudo = "dreame_valetudo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreame_valetudo"]

# Ship the fastboot libusb client + per-model form goldens inside the package, so an installed wheel /
# PyInstaller bundle resolves them via resolve_libexec.
[tool.hatch.build.targets.wheel.force-include]
"libexec/fastboot-libusb.py" = "dreame_valetudo/libexec/fastboot-libusb.py"
"libexec/uart-console.py" = "dreame_valetudo/libexec/uart-console.py"
"libexec/dustbuilder-forms" = "dreame_valetudo/libexec/dustbuilder-forms"
# Ship the changelog inside the package so the installed tool can show "what's new" on upgrade.
"CHANGELOG.md" = "dreame_valetudo/CHANGELOG.md"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # pyflakes + the default pycodestyle subset
    "I",                     # import sorting
    "B", "C4", "FLY", "ISC", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "UP",
    "PLC", "PLE", "PLW",     # pylint conventions/errors/warnings (not the noisy PLR refactor set)
]

[tool.ruff.lint.per-file-ignores]
# False positive: ruff can't see that console.die is NoReturn across the module boundary.
"dreame_valetudo/fastboot.py" = ["RET503"]
"dreame_valetudo/phases/manage.py" = ["RET503"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["dreame_valetudo", "libexec/fastboot-libusb.py", "libexec/uart-console.py"]

# The two subprocess-only transport packages ship no type stubs; only the two libexec helpers
# import them.
[[tool.mypy.overrides]]
module = ["usb.*", "serial.*"]
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
